<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gelişmiş Ultra TV Oynatıcı</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #0f1115;
            color: #ffffff;
            margin: 0;
            padding: 12px;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Şifre Ekranı */
        #auth-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f1115;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100000;
            padding: 20px;
        }
        .auth-container {
            background: #1a1d24;
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid #2a2f3a;
        }

        #main-content { display: none; }
        
        .section-card {
            background: #1a1d24;
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 16px;
            border: 1px solid #2a2f3a;
        }
        
        h3 { margin-top: 0; margin-bottom: 15px; color: #00d2c4; font-size: 18px; font-weight: 600; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 6px; color: #a0aec0; font-size: 14px; }
        
        input[type="text"], input[type="url"], input[type="password"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #2a2f3a;
            background: #212631;
            color: #fff;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #00d2c4; }
        
        button {
            width: 100%;
            padding: 15px;
            background: #00d2c4;
            border: none;
            color: #0f1115;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        
        .refresh-btn {
            background: #2d3748;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            margin-bottom: 14px;
            border-radius: 10px;
        }

        /* Liste Alanı */
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            padding: 14px;
            background: #212631;
            margin-bottom: 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 5px solid #00d2c4;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .stream-title-area {
            flex-grow: 1;
            font-size: 16px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 10px;
        }
        .delete-btn {
            background: #ff4757;
            color: white;
            width: auto;
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 8px;
        }

        /* Gelişmiş Tam Ekran Sinema Modu Oynatıcı */
        #player-wrapper {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            z-index: 9999;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        /* Akıllı Oynatıcı Üst Kontrol Barı */
        .player-top-bar {
            position: absolute;
            top: 0; left: 0; width: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0));
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10005;
        }
        .player-title {
            font-size: 16px; font-weight: bold; color: white;
            max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .external-app-btn {
            background: #ff9f43; color: #000; padding: 8px 14px;
            border-radius: 20px; font-size: 12px; font-weight: bold; width: auto;
        }
        .close-player-btn {
            background: rgba(255,255,255,0.2); color: white; padding: 8px 16px;
            border-radius: 20px; font-size: 13px; width: auto;
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-container">
            <h3>Sistem Girişi</h3>
            <div class="form-group">
                <input type="password" id="global-login-password" placeholder="Günün Şifresi (GGAAAA)" inputmode="numeric">
            </div>
            <button id="auth-submit-btn">Giriş Yap</button>
        </div>
    </div>

    <div id="main-content">
        <button class="refresh-btn" id="refresh-btn">🔄 Listeyi Yenile</button>

        <div class="section-card">
            <h3>Kayıtlı Yayınlar</h3>
            <ul id="stream-list">Yükleniyor...</ul>
        </div>

        <div class="section-card">
            <h3>Yeni Gelişmiş Yayın Ekle</h3>
            <div class="form-group">
                <label>Yayın / Kanal Adı:</label>
                <input type="text" id="stream-name" placeholder="Örn: Canlı Belgesel Vb.">
            </div>
            <div class="form-group">
                <label>Video / Stream Linki (Her Format Desteklenir):</label>
                <input type="url" id="video-link" placeholder="m3u8, mp4, mkv, avi, ts, flv vb...">
            </div>
            <button id="save-btn" style="background: #00d2c4; margin-top: 5px;">Sisteme Kaydet</button>
        </div>
    </div>

    <div id="player-wrapper">
        <div class="player-top-bar">
            <span class="player-title" id="p-title">Yayın Yükleniyor...</span>
            <button class="external-app-btn" id="external-btn">🚀 Telefonda Aç (VLC / MX)</button>
            <button class="close-player-btn" id="close-btn">❌ Kapat</button>
        </div>
        
        <video id="my-video" controls playsinline crossorigin="anonymous"></video>
    </div>

    <script>
        var baseDbUrl = "https://naberdeneme-ffa04-default-rtdb.firebaseio.com/";
        var folderName = "tv_oynatici_yayinlar"; 
        var restUrl = baseDbUrl + folderName + ".json";

        var video = document.getElementById('my-video');
        var playerWrapper = document.getElementById('player-wrapper');
        var streamList = document.getElementById('stream-list');
        var playerTitle = document.getElementById('p-title');
        var externalBtn = document.getElementById('external-btn');
        var hls = null;

        function generateDailyPassword() {
            var today = new Date();
            var dd = String(today.getDate()).padStart(2, '0');
            var mm = String(today.getMonth() + 1).padStart(2, '0');
            var yy = String(today.getFullYear()).substring(2);
            return dd + mm + yy;
        }

        document.getElementById('auth-submit-btn').onclick = function() {
            var userInput = document.getElementById('global-login-password').value.trim();
            if (userInput === generateDailyPassword()) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                loadStreams();
            } else {
                alert("Hatalı gün şifresi!");
            }
        };

        function loadStreams() {
            streamList.innerHTML = '<li>Yükleniyor...</li>';
            var xhr = new XMLHttpRequest();
            xhr.open("GET", restUrl, true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    renderList(JSON.parse(xhr.responseText));
                }
            };
            xhr.send();
        }

        function renderList(data) {
            streamList.innerHTML = '';
            if (!data) {
                streamList.innerHTML = '<li>Kayıtlı yayın bulunamadı.</li>';
                return;
            }
            for (var key in data) {
                if (data.hasOwnProperty(key)) {
                    var stream = data[key];
                    var li = document.createElement('li');
                    
                    var titleSpan = document.createElement('span');
                    titleSpan.className = 'stream-title-area';
                    titleSpan.innerText = stream.name;
                    titleSpan.setAttribute('data-video', stream.videoUrl);
                    
                    titleSpan.onclick = function() {
                        var vUrl = this.getAttribute('data-video');
                        var title = this.innerText;
                        startAdvancedPlayer(vUrl, title);
                    };
                    
                    li.appendChild(titleSpan);

                    var delBtn = document.createElement('button');
                    delBtn.className = 'delete-btn';
                    delBtn.innerText = "Sil";
                    delBtn.setAttribute('data-id', key);
                    delBtn.onclick = function(e) {
                        if (e.stopPropagation) e.stopPropagation();
                        if(confirm("Silinsin mi?")) deleteStream(this.getAttribute('data-id'));
                    };
                    
                    li.appendChild(delBtn);
                    streamList.appendChild(li);
                }
            }
        }

        // HLS Desteği ve Format Çözücü Akıllı Oynatıcı Motoru
        function startAdvancedPlayer(videoUrl, title) {
            playerWrapper.style.display = "block";
            playerTitle.innerText = title;
            
            // Harici oynatıcı butonunun içini ve aksiyonunu ayarla
            externalBtn.onclick = function() {
                var cleanUrl = videoUrl.replace(/^https?:\/\//, '');
                var protocol = videoUrl.startsWith('https') ? 'https' : 'http';
                var intentUri = "intent://" + cleanUrl + "#Intent;scheme=" + protocol + ";type=video/*;title=" + encodeURIComponent(title) + ";end";
                window.location.href = intentUri;
            };

            // Eğer eski bir hls oturumu varsa temizle
            if (hls) {
                hls.destroy();
                hls = null;
            }

            // Durum 1: Eğer video .m3u8 veya canlı akış formatındaysa gelişmiş HLS.js devreye girsin
            if (videoUrl.indexOf('.m3u8') > -1 && Hls.isSupported()) {
                hls = new Hls({
                    maxMaxBufferLength: 30, // Donmaları engellemek için agresif önbellekleme
                    enableWorker: true
                });
                hls.loadSource(videoUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(function(){});
                });
            } 
            // Durum 2: Cihazın (veya Apple Safari'nin) ham HLS desteği varsa veya standart MP4/WebM ise doğrudan yürüt
            else if (video.canPlayType('application/vnd.apple.mpegurl') || videoUrl.indexOf('.m3u8') === -1) {
                video.src = videoUrl;
                video.load();
                video.play().catch(function(e) {
                    console.log("Tarayıcı codec kısıtlaması nedeniyle otomatik başlatamadı. Kontroller hazır.");
                });
            }
        }

        // Yeni Kayıt
        document.getElementById('save-btn').onclick = function() {
            var name = document.getElementById('stream-name').value.trim();
            var videoUrl = document.getElementById('video-link').value.trim();

            if(!name || !videoUrl) { alert("Lütfen tüm alanları doldurun!"); return; }
            
            var xhr = new XMLHttpRequest();
            xhr.open("POST", restUrl, true);
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    alert("Yayın Başarıyla Kaydedildi!");
                    document.getElementById('stream-name').value = '';
                    document.getElementById('video-link').value = '';
                    loadStreams();
                }
            };
            xhr.send(JSON.stringify({name:name, videoUrl:videoUrl}));
        };

        function deleteStream(id) {
            var xhr = new XMLHttpRequest();
            xhr.open("DELETE", baseDbUrl + folderName + "/" + id + ".json", true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) { loadStreams(); }
            };
            xhr.send();
        }

        document.getElementById('refresh-btn').onclick = loadStreams;

        // Oynatıcıyı Kapat ve Hafızayı Sıfırla
        document.getElementById('close-btn').onclick = function() {
            video.pause();
            if (hls) {
                hls.destroy();
                hls = null;
            }
            video.src = "";
            playerWrapper.style.display = "none";
        };
    </script>
</body>
</html>
