<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobil TV Oynatıcı</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 12px;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Şifre Ekranı */
        #auth-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100000;
            padding: 20px;
        }
        .auth-container {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }

        #main-content { display: none; }
        
        .section-card {
            background: #1e1e1e;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        
        h3 { margin-top: 0; margin-bottom: 15px; color: #00adb5; font-size: 18px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 6px; color: #aaaaaa; font-size: 14px; }
        
        input[type="text"], input[type="url"], input[type="password"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #333;
            background: #252a34;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: #00adb5;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .refresh-btn {
            background: #2d3748;
            padding: 10px;
            font-size: 14px;
            margin-bottom: 12px;
        }

        /* Yayın Listesi */
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            padding: 15px;
            background: #252a34;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 4px solid #00adb5;
        }
        .stream-title-area {
            flex-grow: 1;
            font-size: 16px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .delete-btn {
            background: #ff2e63;
            color: white;
            width: auto;
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 6px;
        }

        /* Android için Yerel Oynatıcı Alanı */
        #player-wrapper {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 9999;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        .close-player-btn {
            position: absolute;
            top: 15px; right: 15px;
            background: rgba(0,0,0,0.7);
            color: white; border: 1px solid #fff;
            padding: 10px 20px; border-radius: 20px;
            font-size: 14px; z-index: 10005; width: auto;
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-container">
            <h3>Sistem Girişi</h3>
            <div class="form-group">
                <input type="password" id="global-login-password" placeholder="Günün Şifresi (GGAAAA)" inputmode="numeric">
            </div>
            <button id="auth-submit-btn">Giriş Yap</button>
        </div>
    </div>

    <div id="main-content">
        <button class="refresh-btn" id="refresh-btn">🔄 Listeyi Yenile</button>

        <div class="section-card">
            <h3>Kayıtlı Yayınlar (Oynatmak için dokunun)</h3>
            <ul id="stream-list">Yükleniyor...</ul>
        </div>

        <div class="section-card">
            <h3>Yeni Yayın Ekle</h3>
            <div class="form-group">
                <label>Yayın Adı:</label>
                <input type="text" id="stream-name" placeholder="Örn: Sinema Kanalı">
            </div>
            <div class="form-group">
                <label>Video Linki (URL):</label>
                <input type="url" id="video-link" placeholder="https://.../video.mp4">
            </div>
            <button id="save-btn" style="background: #206a5d; margin-top: 5px;">Sisteme Kaydet</button>
        </div>
    </div>

    <div id="player-wrapper">
        <button class="close-player-btn" id="close-btn">❌ Kapat</button>
        <video id="my-video" controls playsinline crossorigin="anonymous"></video>
    </div>

    <script>
        var baseDbUrl = "https://naberdeneme-ffa04-default-rtdb.firebaseio.com/";
        var folderName = "tv_oynatici_yayinlar"; 
        var restUrl = baseDbUrl + folderName + ".json";

        var video = document.getElementById('my-video');
        var playerWrapper = document.getElementById('player-wrapper');
        var streamList = document.getElementById('stream-list');

        function generateDailyPassword() {
            var today = new Date();
            var dd = String(today.getDate()).padStart(2, '0');
            var mm = String(today.getMonth() + 1).padStart(2, '0');
            var yy = String(today.getFullYear()).substring(2);
            return dd + mm + yy;
        }

        document.getElementById('auth-submit-btn').onclick = function() {
            var userInput = document.getElementById('global-login-password').value.trim();
            if (userInput === generateDailyPassword()) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                loadStreams();
            } else {
                alert("Hatalı gün şifresi!");
            }
        };

        function loadStreams() {
            streamList.innerHTML = '<li>Yükleniyor...</li>';
            var xhr = new XMLHttpRequest();
            xhr.open("GET", restUrl, true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    renderList(JSON.parse(xhr.responseText));
                }
            };
            xhr.send();
        }

        function renderList(data) {
            streamList.innerHTML = '';
            if (!data) {
                streamList.innerHTML = '<li>Kayıtlı yayın bulunamadı.</li>';
                return;
            }
            for (var key in data) {
                if (data.hasOwnProperty(key)) {
                    var stream = data[key];
                    var li = document.createElement('li');
                    
                    var titleSpan = document.createElement('span');
                    titleSpan.className = 'stream-title-area';
                    titleSpan.innerText = stream.name;
                    titleSpan.setAttribute('data-video', stream.videoUrl);
                    
                    titleSpan.onclick = function() {
                        var vUrl = this.getAttribute('data-video');
                        startNativePlayer(vUrl);
                    };
                    
                    li.appendChild(titleSpan);

                    var delBtn = document.createElement('button');
                    delBtn.className = 'delete-btn';
                    delBtn.innerText = "Sil";
                    delBtn.setAttribute('data-id', key);
                    delBtn.onclick = function(e) {
                        if (e.stopPropagation) e.stopPropagation();
                        if(confirm("Silinsin mi?")) deleteStream(this.getAttribute('data-id'));
                    };
                    
                    li.appendChild(delBtn);
                    streamList.appendChild(li);
                }
            }
        }

        // Android Donanım Çözücüsünü Çalıştıran Saf Yapı
        function startNativePlayer(videoUrl) {
            playerWrapper.style.display = "block";
            video.src = videoUrl;
            video.load();
            
            // Android Chrome'un 'Kullanıcı dokunmadan sesli video başlatılamaz' blokajını aşmak için
            // videoyu doğrudan oynatmayı dener, oynatılamazsa oynat butonunu telefona bırakır.
            var playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(function(error) {
                    console.log("Otomatik oynatma engellendi, oynatma kontrolü kullanıcıya bırakıldı.");
                });
            }
        }

        // Yeni Kayıt
        document.getElementById('save-btn').onclick = function() {
            var name = document.getElementById('stream-name').value.trim();
            var videoUrl = document.getElementById('video-link').value.trim();

            if(!name || !videoUrl) { alert("Alanlar zorunludur!"); return; }
            
            var xhr = new XMLHttpRequest();
            xhr.open("POST", restUrl, true);
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    alert("Eklendi!");
                    document.getElementById('stream-name').value = '';
                    document.getElementById('video-link').value = '';
                    loadStreams();
                }
            };
            xhr.send(JSON.stringify({name:name, videoUrl:videoUrl}));
        };

        function deleteStream(id) {
            var xhr = new XMLHttpRequest();
            xhr.open("DELETE", baseDbUrl + folderName + "/" + id + ".json", true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) { loadStreams(); }
            };
            xhr.send();
        }

        document.getElementById('refresh-btn').onclick = loadStreams;

        document.getElementById('close-btn').onclick = function() {
            video.pause();
            video.src = "";
            playerWrapper.style.display = "none";
        };
    </script>
</body>
</html>
