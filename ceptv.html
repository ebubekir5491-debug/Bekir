<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kesin Çözüm Mobil TV</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #0f1115;
            color: #ffffff;
            margin: 0;
            padding: 12px;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Şifre Ekranı */
        #auth-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f1115;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100000;
            padding: 20px;
        }
        .auth-container {
            background: #1a1d24;
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid #2a2f3a;
        }

        #main-content { display: none; }
        
        .section-card {
            background: #1a1d24;
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 16px;
            border: 1px solid #2a2f3a;
        }
        
        h3 { margin-top: 0; margin-bottom: 8px; color: #00d2c4; font-size: 18px; font-weight: 600; }
        .subtitle-desc { color: #8a99ad; font-size: 13px; margin-bottom: 15px; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 6px; color: #a0aec0; font-size: 14px; }
        
        input[type="text"], input[type="url"], input[type="password"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #2a2f3a;
            background: #212631;
            color: #fff;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: #00d2c4;
            border: none;
            color: #0f1115;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .refresh-btn {
            background: #2d3748;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            margin-bottom: 14px;
            border-radius: 10px;
        }

        /* Liste Alanı */
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            padding: 12px;
            background: #212631;
            margin-bottom: 12px;
            border-radius: 10px;
            display: flex;
            flex-direction: column; /* Mobilde butonlar alt alta daha rahat bassın */
            gap: 10px;
            border-left: 5px solid #00d2c4;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .stream-info {
            font-size: 16px;
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #fff;
            padding: 4px 0;
        }

        .action-group {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        /* Gerçek ve Güvenli Oynatma Linkleri */
        .play-anchor {
            flex-grow: 1;
            text-align: center;
            text-decoration: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            color: #fff;
            display: block;
        }
        
        .btn-system { background: #341f97; }
        .btn-vlc { background: #ff9f43; color: #0f1115; }

        .delete-btn {
            background: #ff4757;
            color: white;
            width: auto;
            padding: 0 15px;
            font-size: 13px;
            border-radius: 8px;
            border: none;
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-container">
            <h3>Sistem Girişi</h3>
            <div class="form-group">
                <input type="password" id="global-login-password" placeholder="Günün Şifresi (GGAAAA)" inputmode="numeric">
            </div>
            <button id="auth-submit-btn">Giriş Yap</button>
        </div>
    </div>

    <div id="main-content">
        <button class="refresh-btn" id="refresh-btn">🔄 Listeyi Yenile</button>

        <div class="section-card">
            <h3>Kayıtlı Kanallar</h3>
            <div class="subtitle-desc">Tarayıcı engelleri kaldırıldı. Doğrudan açmak istediğiniz oynatıcı butonuna dokunun:</div>
            <ul id="stream-list">Yükleniyor...</ul>
        </div>

        <div class="section-card">
            <h3>Yeni Yayın Ekle</h3>
            <div class="form-group">
                <label>Yayın / Kanal Adı:</label>
                <input type="text" id="stream-name" placeholder="Örn: Sinema Kanalı">
            </div>
            <div class="form-group">
                <label>Video / Stream Linki:</label>
                <input type="url" id="video-link" placeholder="m3u8, mp4, mkv, ts vb...">
            </div>
            <button id="save-btn" style="margin-top: 5px;">Sisteme Kaydet</button>
        </div>
    </div>

    <script>
        var baseDbUrl = "https://naberdeneme-ffa04-default-rtdb.firebaseio.com/";
        var folderName = "tv_oynatici_yayinlar"; 
        var restUrl = baseDbUrl + folderName + ".json";
        var streamList = document.getElementById('stream-list');

        function generateDailyPassword() {
            var today = new Date();
            var dd = String(today.getDate()).padStart(2, '0');
            var mm = String(today.getMonth() + 1).padStart(2, '0');
            var yy = String(today.getFullYear()).substring(2);
            return dd + mm + yy;
        }

        document.getElementById('auth-submit-btn').onclick = function() {
            var userInput = document.getElementById('global-login-password').value.trim();
            if (userInput === generateDailyPassword()) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                loadStreams();
            } else {
                alert("Hatalı gün şifresi!");
            }
        };

        function loadStreams() {
            streamList.innerHTML = '<li>Yükleniyor...</li>';
            var xhr = new XMLHttpRequest();
            xhr.open("GET", restUrl, true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    renderList(JSON.parse(xhr.responseText));
                }
            };
            xhr.send();
        }

        function renderList(data) {
            streamList.innerHTML = '';
            if (!data) {
                streamList.innerHTML = '<li>Kayıtlı yayın bulunamadı.</li>';
                return;
            }
            for (var key in data) {
                if (data.hasOwnProperty(key)) {
                    var stream = data[key];
                    var li = document.createElement('li');
                    
                    // Kanal ismi
                    var infoDiv = document.createElement('div');
                    infoDiv.className = 'stream-info';
                    infoDiv.innerText = stream.name;
                    li.appendChild(infoDiv);

                    // Buton grubu oluşturma
                    var actionGroup = document.createElement('div');
                    actionGroup.className = 'action-group';

                    var cleanUrl = stream.videoUrl.replace(/^https?:\/\//, '');
                    var protocol = stream.videoUrl.startsWith('https') ? 'https' : 'http';

                    // 1. Buton: Normal Sistem Oynatıcısı (MX, Samsung Video, VLC vb.)
                    var systemIntent = "intent://" + cleanUrl + "#Intent;scheme=" + protocol + ";type=video/*;title=" + encodeURIComponent(stream.name) + ";end";
                    var sysAnchor = document.createElement('a');
                    sysAnchor.className = "play-anchor btn-system";
                    sysAnchor.href = systemIntent;
                    sysAnchor.innerText = "▶ Oynat";
                    actionGroup.appendChild(sysAnchor);

                    // 2. Buton: Doğrudan VLC Player'ı hedef alan Özel Güvenli Köprü
                    // Telefondaki VLC uygulamasını doğrudan uyandırır ve CORS engelini tamamen sıfırlar
                    var vlcIntent = "intent://" + cleanUrl + "#Intent;scheme=" + protocol + ";package=org.videolan.vlc;type=video/*;title=" + encodeURIComponent(stream.name) + ";end";
                    var vlcAnchor = document.createElement('a');
                    vlcAnchor.className = "play-anchor btn-vlc";
                    vlcAnchor.href = vlcIntent;
                    vlcAnchor.innerText = "🍊 VLC ile Aç";
                    actionGroup.appendChild(vlcAnchor);

                    // 3. Buton: Sil Butonu
                    var delBtn = document.createElement('button');
                    delBtn.className = 'delete-btn';
                    delBtn.innerText = "Sil";
                    delBtn.setAttribute('data-id', key);
                    delBtn.onclick = function(e) {
                        if(confirm("Silinsin mi?")) deleteStream(this.getAttribute('data-id'));
                    };
                    actionGroup.appendChild(delBtn);

                    li.appendChild(actionGroup);
                    streamList.appendChild(li);
                }
            }
        }

        // Yeni Kayıt
        document.getElementById('save-btn').onclick = function() {
            var name = document.getElementById('stream-name').value.trim();
            var videoUrl = document.getElementById('video-link').value.trim();

            if(!name || !videoUrl) { alert("Lütfen tüm alanları doldurun!"); return; }
            
            var xhr = new XMLHttpRequest();
            xhr.open("POST", restUrl, true);
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    alert("Başarıyla Eklendi!");
                    document.getElementById('stream-name').value = '';
                    document.getElementById('video-link').value = '';
                    loadStreams();
                }
            };
            xhr.send(JSON.stringify({name:name, videoUrl:videoUrl}));
        };

        function deleteStream(id) {
            var xhr = new XMLHttpRequest();
            xhr.open("DELETE", baseDbUrl + folderName + "/" + id + ".json", true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) { loadStreams(); }
            };
            xhr.send();
        }

        document.getElementById('refresh-btn').onclick = loadStreams;
    </script>
</body>
</html>
