<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sıkıcı Kontrol Paneli</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 20px; background-color: #f5f7fa; color: #333; }
        
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 3px solid #28a745; padding-bottom: 15px; }
        h1 { color: #28a745; margin: 0; font-size: 24px; }
        h2 { color: #333; font-size: 18px; margin: 25px 0 15px 0; border-left: 5px solid #28a745; padding-left: 10px; }
        
        /* Navigasyon ve Dosya Alanı */
        .actions-wrapper { display: flex; gap: 15px; align-items: center; }
        .file-input-wrapper { background-color: #e9ecef; padding: 10px 15px; border-radius: 4px; border: 2px dashed #28a745; font-size: 14px; font-weight: bold; }
        .btn-nav { background-color: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 14px; }
        .btn-nav:hover { background-color: #0056b3; }
        
        /* Form ve Tablo Alanları */
        .main-container { display: flex; gap: 20px; }
        .form-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 350px; flex-shrink: 0; }
        .table-box { flex-grow: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        
        .btn-block { width: 100%; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 14px; }
        .btn-save { background-color: #28a745; color: white; }
        .btn-save:hover { background-color: #218838; }
        .btn-clear { background-color: #6c757d; color: white; }
        .btn-clear:hover { background-color: #5a6268; }
        
        /* Tablo Tasarımı */
        .table-responsive { overflow-x: auto; margin-top: 10px; max-height: 650px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 10px; border: 1px solid #dee2e6; font-size: 13px; text-align: center; }
        th { background-color: #f8f9fa; color: #495057; font-weight: bold; position: sticky; top: 0; z-index: 10; }
        tbody tr:hover { background-color: #f1f5f9; }
        
        .img-preview { max-width: 40px; max-height: 40px; object-fit: cover; border-radius: 4px; }
        
        /* Durum Etiketleri */
        .status-badge { padding: 4px 8px; border-radius: 20px; font-size: 11px; font-weight: bold; color: white; display: inline-block; width: 100px; text-transform: uppercase; }
        .status-aktif { background-color: #28a745; }
        .status-arızalı { background-color: #dc3545; }
        .status-yedek { background-color: #ffc107; color: #212529; }
        .status-kalibrasyonda { background-color: #17a2b8; }
        
        .btn-row { padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; color: white; }
        .btn-edit { background-color: #ffc107; color: black; margin-right: 5px; }
        .btn-delete { background-color: #dc3545; }
        
        .json-actions { margin-top: 15px; display: flex; justify-content: flex-end; gap: 10px; }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>📋 TÜRKTRAKTÖR ERENLER FABRİKASI - SIKICI KONTROL PANELİ</h1>
        <div class="actions-wrapper">
            <div class="file-input-wrapper">
                <label for="jsonFileInput" style="cursor:pointer;">📂 Listeyi Yükle (JSON): </label>
                <input type="file" id="jsonFileInput" accept=".json" onchange="loadJSON(this)">
            </div>
            <!-- Analiz Paneline Geçiş Butonu -->
            <button class="btn-nav" onclick="window.location.href='Durum.html'">📊 Durum Analiz Paneline Git</button>
        </div>
    </div>

    <div class="main-container">
        <!-- Sol Taraf: Kayıt ve Düzenleme Formu -->
        <div class="form-box">
            <h3 id="formTitle" style="margin-top:0; color:#28a745; border-bottom:2px solid #eee; padding-bottom:5px;">🛠️ Yeni Sıkıcı Ekle</h3>
            <input type="hidden" id="editIndex" value="-1">
            
            <div class="form-group">
                <label>Seri No (Benzersiz):</label>
                <input type="text" id="seriNo" placeholder="Örn: 20M123456">
            </div>
            <div class="form-group">
                <label>ID No:</label>
                <input type="text" id="idNo" placeholder="Örn: TT-9876">
            </div>
            <div class="form-group">
                <label>Marka:</label>
                <input type="text" id="marka" placeholder="Örn: Atlas Copco">
            </div>
            <div class="form-group">
                <label>Model:</label>
                <input type="text" id="model" placeholder="Örn: Tensor STR">
            </div>
            <div class="form-group">
                <label>Tork Aralığı:</label>
                <input type="text" id="tork" placeholder="Örn: 10-50 Nm">
            </div>
            <div class="form-group">
                <label>Tip:</label>
                <select id="tip">
                    <option value="Elektrikli">Elektrikli</option>
                    <option value="Bataryalı">Bataryalı</option>
                    <option value="Pnömatik">Pnömatik</option>
                </select>
            </div>
            <div class="form-group">
                <label>Durum:</label>
                <select id="durum">
                    <option value="Aktif">Aktif</option>
                    <option value="Arızalı">Arızalı</option>
                    <option value="Yedek">Yedek</option>
                    <option value="Kalibrasyonda">Kalibrasyonda</option>
                </select>
            </div>
            <div class="form-group">
                <label>Görsel URL / Base64:</label>
                <input type="text" id="gorsel" placeholder="Resim linki veya bos bırakın">
            </div>
            <div class="form-group">
                <label>Bulunduğu Hat / İstasyon:</label>
                <input type="text" id="hat" placeholder="Örn: Gövde Montaj / AGP-05">
            </div>
            <div class="form-group">
                <label>Alım Tarihi:</label>
                <input type="date" id="alimTarihi">
            </div>
            
            <button class="btn-block btn-save" onclick="kaydet()">💾 Listeye Kaydet</button>
            <button class="btn-block btn-clear" onclick="formuTemizle()">Vazgeç / Temizle</button>
        </div>

        <!-- Sağ Taraf: Mevcut Sıkıcı Listesi Yönetimi -->
        <div class="table-box">
            <h3 style="margin-top:0; color:#333;">📦 Fabrika Cihaz Listesi Envanteri</h3>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Görsel</th> <th>Seri No</th> <th>ID No</th> <th>Marka - Model</th> <th>Tip</th> <th>Durum</th> <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="kontrolTableBody">
                        <tr>
                            <td colspan="7" style="color:#888; padding:30px;">⚠️ Lütfen yukarıdan JSON dosyanızı yükleyin veya yeni cihaz ekleyin.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div class="json-actions">
                <button class="btn-row" style="background-color: #17a2b8; padding:10px 15px;" onclick="hafizayiSifirla()">🔄 Hafızayı Boşalt</button>
                <button class="btn-row" style="background-color: #218838; padding:10px 15px;" onclick="exportJSON()">📥 Güncel JSON Olarak İndir</button>
            </div>
        </div>
    </div>

    <script>
        let sikiciListesi = [];

        // Sayfa ilk açıldığında localStorage hafızasında kayıt var mı diye kontrol eder
        window.onload = function() {
            const kayitliVeri = localStorage.getItem('sikiciListesiVerisi');
            if (kayitliVeri) {
                try {
                    sikiciListesi = JSON.parse(kayitliVeri);
                    tabloyuGuncelle();
                } catch (e) {
                    console.error("Hafıza yüklenirken hata oluştu.", e);
                }
            }
        };

        // Hafızayı senkronize eden ortak fonksiyon
        function hafizayiGuncelle() {
            localStorage.setItem('sikiciListesiVerisi', JSON.stringify(sikiciListesi));
        }

        // Dışarıdan seçilen JSON dosyasını okur ve hafızaya yazar
        function loadJSON(input) {
            if (!input.files || input.files.length === 0) return;
            const okuyucu = new FileReader();
            
            okuyucu.onload = function(e) {
                try {
                    const temizVeri = JSON.parse(e.target.result.trim());
                    if (Array.isArray(temizVeri)) { 
                        sikiciListesi = temizVeri; 
                        
                        // Durum sayfasının anlık görmesi için tarayıcı hafızasına yazıyoruz
                        hafizayiGuncelle();
                        tabloyuGuncelle();
                        
                        alert(`Başarılı! ${temizVeri.length} adet sıkıcı cihazı başarıyla yüklendi.`);
                    } else { alert("Hata: JSON formatı bir dizi (array) olmalıdır!"); }
                } catch (error) { alert("Hata: JSON dosyası çözümlenemedi!"); }
                input.value = '';
            };
            okuyucu.readAsText(input.files[0], "UTF-8");
        }

        // Form verilerini listeye ekler veya düzenler
        function kaydet() {
            const seriNo = document.getElementById('seriNo').value.trim();
            const idNo = document.getElementById('idNo').value.trim();
            const marka = document.getElementById('marka').value.trim();
            const model = document.getElementById('model').value.trim();
            const tork = document.getElementById('tork').value.trim();
            const tip = document.getElementById('tip').value;
            const durum = document.getElementById('durum').value;
            const gorsel = document.getElementById('gorsel').value.trim();
            const hat = document.getElementById('hat').value.trim();
            const alimTarihi = document.getElementById('alimTarihi').value;
            const editIndex = parseInt(document.getElementById('editIndex').value);

            if (!seriNo || !idNo) {
                alert("Seri No ve ID No alanları boş bırakılamaz!");
                return;
            }

            // Eğer yeni ekleme yapılıyorsa ve Seri No zaten mevcutsa engelle
            if (editIndex === -1 && sikiciListesi.some(s => String(s.seriNo).toLowerCase() === seriNo.toLowerCase())) {
                alert("Bu Seri Numarasına sahip bir cihaz zaten listede var!");
                return;
            }

            const logTarih = new Date().toISOString().split('T')[0];

            if (editIndex === -1) {
                // Yeni Cihaz Ekleme
                const yeniCihaz = {
                    seriNo, idNo, marka, model, tork, tip, durum, gorsel, hat, alimTarihi,
                    logs: [{ tarih: logTarih, mesaj: "Cihaz envantere yeni kaydedildi." }]
                };
                sikiciListesi.push(yeniCihaz);
            } else {
                // Mevcut Cihazı Düzenleme
                const eskiDurum = sikiciListesi[editIndex].durum;
                sikiciListesi[editIndex].seriNo = seriNo;
                sikiciListesi[editIndex].idNo = idNo;
                sikiciListesi[editIndex].marka = marka;
                sikiciListesi[editIndex].model = model;
                sikiciListesi[editIndex].tork = tork;
                sikiciListesi[editIndex].tip = tip;
                sikiciListesi[editIndex].durum = durum;
                sikiciListesi[editIndex].gorsel = gorsel;
                sikiciListesi[editIndex].hat = hat;
                sikiciListesi[editIndex].alimTarihi = alimTarihi;

                if (eskiDurum !== durum) {
                    if (!sikiciListesi[editIndex].logs) sikiciListesi[editIndex].logs = [];
                    sikiciListesi[editIndex].logs.push({
                        tarih: logTarih,
                        mesaj: `Durum "${eskiDurum}" değerinden "${durum}" değerine güncellendi.`
                    });
                }
            }

            hafizayiGuncelle();
            tabloyuGuncelle();
            formuTemizle();
        }

        // Satırdaki verileri düzenlemek için forma yükler
        function cihazDuzenle(index) {
            const cihaz = sikiciListesi[index];
            document.getElementById('seriNo').value = cihaz.seriNo;
            document.getElementById('idNo').value = cihaz.idNo;
            document.getElementById('marka').value = cihaz.marka || '';
            document.getElementById('model').value = cihaz.model || '';
            document.getElementById('tork').value = cihaz.tork || '';
            document.getElementById('tip').value = cihaz.tip || 'Elektrikli';
            document.getElementById('durum').value = cihaz.durum || 'Aktif';
            document.getElementById('gorsel').value = cihaz.gorsel || '';
            document.getElementById('hat').value = cihaz.hat || '';
            document.getElementById('alimTarihi').value = cihaz.alimTarihi || '';
            
            document.getElementById('editIndex').value = index;
            document.getElementById('formTitle').innerHTML = "📝 Cihaz Bilgilerini Düzenle";
            document.getElementById('formTitle').style.color = "#ffc107";
        }

        // Cihazı listeden siler
        function cihazSil(index) {
            if (confirm("Bu sıkıcı cihazını envanterden silmek istediğinize emin misiniz?")) {
                sikiciListesi.splice(index, 1);
                hafizayiGuncelle();
                tabloyuGuncelle();
            }
        }

        // Form girdilerini sıfırlar
        function formuTemizle() {
            document.getElementById('seriNo').value = '';
            document.getElementById('idNo').value = '';
            document.getElementById('marka').value = '';
            document.getElementById('model').value = '';
            document.getElementById('tork').value = '';
            document.getElementById('gorsel').value = '';
            document.getElementById('hat').value = '';
            document.getElementById('alimTarihi').value = '';
            document.getElementById('editIndex').value = '-1';
            
            document.getElementById('formTitle').innerHTML = "🛠️ Yeni Sıkıcı Ekle";
            document.getElementById('formTitle').style.color = "#28a745";
        }

        // Hafızayı komple sıfırlama işlevi
        function hafizayiSifirla() {
            if (confirm("Tüm envanter listesini temizlemek istediğinize emin misiniz? Bu işlem geri alınamaz.")) {
                sikiciListesi = [];
                localStorage.removeItem('sikiciListesiVerisi');
                tabloyuGuncelle();
            }
        }

        // Tabloyu güncel listeye göre HTML üzerinde yeniden oluşturur
        function tabloyuGuncelle() {
            const tbody = document.getElementById('kontrolTableBody');
            tbody.innerHTML = '';

            if (sikiciListesi.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="color:#888; padding:30px;">⚠️ Envanterde kayıtlı cihaz bulunmamaktadır.</td></tr>`;
                return;
            }

            sikiciListesi.forEach((item, index) => {
                const tr = document.createElement('tr');
                let imgHtml = item.gorsel ? `<img src="${item.gorsel}" class="img-preview" onerror="this.src='https://placeholder.com'">` : '<span>Yok</span>';
                let dClass = String(item.durum).trim().toLowerCase() === "kalibrasyonda" ? "kalibrasyonda" : String(item.durum).trim().toLowerCase();

                tr.innerHTML = `
                    <td>${imgHtml}</td>
                    <td style="font-weight:bold;">${item.seriNo}</td>
                    <td>${item.idNo}</td>
                    <td>${item.marka || '-'} - ${item.model || '-'}</td>
                    <td>${item.tip || '-'}</td>
                    <td><span class="status-badge status-${dClass}">${item.durum}</span></td>
                    <td>
                        <button class="btn-row btn-edit" onclick="cihazDuzenle(${index})">Düzenle</button>
                        <button class="btn-row btn-delete" onclick="cihazSil(${index})">Sil</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Listeyi güncel haliyle bilgisayara bir JSON dosyası olarak indirir
        function exportJSON() {
            if (sikiciListesi.length === 0) {
                alert("İndirmek için listede veri bulunmalıdır!");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(sikiciListesi, null, 4));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "TurkTraktor_Sikici_Envanter_Listesi.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }
    </script>
</body>
</html>
