<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Senkronize TV Oynatıcı (Avrupa Sunucusu Uyumlu)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container, .list-container {
            width: 90%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            margin: 0 auto 20px auto;
            box-sizing: border-box;
            text-align: left;
        }
        h2, h3 { text-align: center; color: #00adb5; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #eeeeee; }
        input[type="text"], input[type="url"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #393e46;
            background: #222831;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #00adb5;
            border: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            padding: 18px;
            background: #222831;
            margin-bottom: 12px;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            display: block;
            overflow: hidden;
        }
        .stream-title {
            display: inline-block;
            width: 70%;
            font-size: 18px;
            font-weight: bold;
            vertical-align: middle;
        }
        .delete-btn {
            position: absolute;
            right: 10px;
            top: 12px;
            width: auto;
            background: #ff2e63;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        video::cue {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 24px;
        }
        #player-wrapper {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 9999;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        /* Akıllı Gizleme için Geçiş Efekti Eklendi */
        .controls {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.85);
            padding: 20px;
            box-sizing: border-box;
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Kontroller gizlendiğinde tetiklenecek CSS */
        #player-wrapper.hide-interface {
            cursor: none !important;
        }
        #player-wrapper.hide-interface .controls {
            opacity: 0;
            transform: translateY(100%);
            pointer-events: none; /* Gizliyken yanlışlıkla tıklanmasını önler */
        }

        .control-inside {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .control-btn {
            background: none; border: none; color: white;
            font-size: 26px; cursor: pointer; width: auto; padding: 0 10px;
        }
        .progress-container {
            flex-grow: 1; position: relative; cursor: pointer; height: 14px; background: #555; border-radius: 6px;
        }
        .progress-bar { height: 100%; background: #00adb5; width: 0%; border-radius: 6px; }
        .time-display { font-size: 16px; min-width: 110px; text-align: center; }
        .refresh-area { text-align: right; margin-bottom: 10px; }
        .refresh-btn { background: #393e46; padding: 5px 10px; font-size: 14px; width: auto; display: inline-block; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Yayın Kayıt Formu</h2>
        <div class="form-group">
            <label>Yayın Adı:</label>
            <input type="text" id="stream-name" placeholder="Örn: Benim Sinemam">
        </div>
        <div class="form-group">
            <label>Video Linki (URL):</label>
            <input type="url" id="video-link" placeholder="https://example.com/video.mp4">
        </div>
        <div class="form-group">
            <label>Ses Linki (URL):</label>
            <input type="url" id="audio-link" placeholder="https://example.com/ses.mp3">
        </div>
        <div class="form-group">
            <label>Altyazı Linki (URL - İsteğe Bağlı):</label>
            <input type="url" id="subtitle-link" placeholder="https://example.com/altyazi.vtt">
        </div>
        <div class="form-group">
            <label>Giriş ve Silme Şifresi:</label>
            <input type="password" id="stream-password" placeholder="Şifre belirleyin">
        </div>
        <button id="save-btn">Kaydet</button>
    </div>

    <div class="list-container">
        <div class="refresh-area">
            <button class="refresh-btn" id="refresh-btn">🔄 Listeyi Yenile</button>
        </div>
        <h3>Kayıtlı Yayınlar</h3>
        <ul id="stream-list">Yükleniyor...</ul>
    </div>

    <div id="player-wrapper">
        <video id="my-video" preload="auto" playsinline></video>
        <audio id="my-audio" preload="auto"></audio>
        
        <div class="controls">
            <div class="control-inside">
                <button class="control-btn" id="play-pause-btn">⏸</button>
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div class="time-display" id="time-display">00:00 / 00:00</div>
                <button class="control-btn" id="close-btn">❌ Kapat</button>
            </div>
        </div>
    </div>

    <script>
        var baseDbUrl = "https://naberdeneme-ffa04-default-rtdb.firebaseio.com/";
        var restUrl = baseDbUrl + "yayinlar.json";

        var video = document.getElementById('my-video');
        var audio = document.getElementById('my-audio');
        var playerWrapper = document.getElementById('player-wrapper');
        var progressBar = document.getElementById('progress-bar');
        var progressContainer = document.getElementById('progress-container');
        var timeDisplay = document.getElementById('time-display');
        var playPauseBtn = document.getElementById('play-pause-btn');
        var streamList = document.getElementById('stream-list');

        var isSeeking = false;
        var syncInterval = null;
        
        // Zamanlayıcı için yeni değişken
        var hideTimeout = null;

        function loadStreams() {
            streamList.innerHTML = '<li>Yükleniyor...</li>';
            
            var xhr = new XMLHttpRequest();
            xhr.open("GET", restUrl, true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            renderList(data);
                        } catch(e) {
                            streamList.innerHTML = '<li>Veri çözümleme hatası!</li>';
                        }
                    } else {
                        streamList.innerHTML = '<li>Bağlantı Kurulamadı! (Firebase URL veya Kural hatası. Kod: ' + xhr.status + ')</li>';
                    }
                }
            };
            xhr.send();
        }

        function renderList(data) {
            streamList.innerHTML = '';
            if (!data) {
                streamList.innerHTML = '<li>Henüz kayıtlı yayın yok.</li>';
                return;
            }

            for (var key in data) {
                if (data.hasOwnProperty(key)) {
                    var stream = data[key];
                    var li = document.createElement('li');
                    
                    li.setAttribute('data-video', stream.videoUrl);
                    li.setAttribute('data-audio', stream.audioUrl);
                    li.setAttribute('data-sub', stream.subtitleUrl || '');
                    li.setAttribute('data-pass', stream.password);
                    
                    li.onclick = function() {
                        var vUrl = this.getAttribute('data-video');
                        var aUrl = this.getAttribute('data-audio');
                        var sUrl = this.getAttribute('data-sub');
                        var realPass = this.getAttribute('data-pass');
                        
                        var userPass = prompt("Bu yayın için şifreyi girin:");
                        if (userPass === null) return;
                        
                        if (userPass === realPass) {
                            startPlayer(vUrl, aUrl, sUrl);
                        } else {
                            alert("Hatalı şifre!");
                        }
                    };
                    
                    li.innerHTML = "<span class='stream-title'>" + stream.name + "</span>" +
                                   "<button class='delete-btn' data-id='" + key + "' data-pass='" + stream.password + "'>Sil</button>";
                    
                    streamList.appendChild(li);
                }
            }

            var deleteButtons = streamList.getElementsByTagName('button');
            for(var i=0; i<deleteButtons.length; i++) {
                deleteButtons[i].onclick = function(e) {
                    if (e && e.stopPropagation) e.stopPropagation();
                    else window.event.cancelBubble = true; 
                    
                    var id = this.getAttribute('data-id');
                    var realPass = this.getAttribute('data-pass');
                    
                    var userPass = prompt("Silmek için şifreyi girin:");
                    if (userPass === null) return;
                    
                    if (userPass === realPass) {
                        deleteStream(id);
                    } else {
                        alert("Hatalı şifre!");
                    }
                };
            }
        }

        document.getElementById('save-btn').onclick = function() {
            var name = document.getElementById('stream-name').value.trim();
            var videoUrl = document.getElementById('video-link').value.trim();
            var audioUrl = document.getElementById('audio-link').value.trim();
            var subtitleUrl = document.getElementById('subtitle-link').value.trim();
            var password = document.getElementById('stream-password').value.trim();

            if(!name || !videoUrl || !audioUrl || !password) {
                alert("Lütfen Altyazı hariç tüm alanları doldurun!");
                return;
            }

            var payload = JSON.stringify({
                name: name,
                videoUrl: videoUrl,
                audioUrl: audioUrl,
                subtitleUrl: subtitleUrl,
                password: password
            });

            var xhr = new XMLHttpRequest();
            xhr.open("POST", restUrl, true);
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        alert("Başarıyla Kaydedildi!");
                        document.getElementById('stream-name').value = '';
                        document.getElementById('video-link').value = '';
                        document.getElementById('audio-link').value = '';
                        document.getElementById('subtitle-link').value = '';
                        document.getElementById('stream-password').value = '';
                        loadStreams(); 
                    } else {
                        alert("Firebase Kayıt Reddedildi! Kuralları (Rules) kontrol edin. Kod: " + xhr.status);
                    }
                }
            };
            xhr.send(payload);
        };

        function deleteStream(id) {
            var deleteUrl = baseDbUrl + "yayinlar/" + id + ".json";
            var xhr = new XMLHttpRequest();
            xhr.open("DELETE", deleteUrl, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        alert("Yayın silindi.");
                        loadStreams();
                    } else {
                        alert("Silme başarısız.");
                    }
                }
            };
            xhr.send();
        }

        document.getElementById('refresh-btn').onclick = loadStreams;
        window.onload = loadStreams;

        function startPlayer(videoUrl, audioUrl, subtitleUrl) {
            var oldTracks = video.getElementsByTagName('track');
            while(oldTracks.length > 0) { video.removeChild(oldTracks[0]); }

            video.src = videoUrl;
            audio.src = audioUrl;

            if (subtitleUrl && subtitleUrl !== "") {
                var track = document.createElement('track');
                track.kind = 'captions';
                track.label = 'Türkçe';
                track.srclang = 'tr';
                track.src = subtitleUrl;
                track.default = true;
                video.appendChild(track);
            }

            playerWrapper.style.display = "block";
            video.load();
            audio.load();

            if (playerWrapper.requestFullscreen) playerWrapper.requestFullscreen();
            else if (playerWrapper.webkitRequestFullscreen) playerWrapper.webkitRequestFullscreen();

            video.play().catch(function(){});
            audio.play().catch(function(){});
            playPauseBtn.innerText = "⏸";

            if(syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(smoothSyncCheck, 250);
            
            // Oynatıcı başladığında gizleme mekanizmasını başlat
            resetHideTimer();
        }

        // Akıllı Arayüz Gizleme Fonksiyonları
        function resetHideTimer() {
            // Arayüzü görünür kıl (CSS sınıfını kaldır)
            playerWrapper.classList.remove('hide-interface');
            
            // Mevcut zamanlayıcıyı sıfırla
            if (hideTimeout) clearTimeout(hideTimeout);
            
            // Eğer video duraklatılmışsa otomatik gizleme yapma (kullanıcı rahat rahat incelesin)
            if (video.paused) return;

            // 3 saniye (3000 ms) boyunca hareket olmazsa gizle
            hideTimeout = setTimeout(function() {
                playerWrapper.classList.add('hide-interface');
            }, 3000);
        }

        // Fare hareket ettikçe veya ekrana dokunuldukça süreyi sıfırla
        playerWrapper.onmousemove = resetHideTimer;
        playerWrapper.onclick = resetHideTimer;
        playerWrapper.ontouchstart = resetHideTimer;

        function smoothSyncCheck() {
            if (isSeeking || video.paused || video.seeking) return;

            var percentage = (video.currentTime / video.duration) * 100;
            if(!isNaN(percentage)) {
                progressBar.style.width = percentage + "%";
                timeDisplay.innerText = formatTime(video.currentTime) + " / " + formatTime(video.duration);
            }

            var diff = video.currentTime - audio.currentTime;

            if (Math.abs(diff) > 0.1 && Math.abs(diff) <= 0.5) {
                if (diff > 0) { audio.playbackRate = 1.05; } else { audio.playbackRate = 0.95; }
            } 
            else if (Math.abs(diff) > 0.5) {
                audio.playbackRate = 1.0; 
                if (diff < 0) { 
                    if (!audio.paused) {
                        audio.pause();
                        var watchVideo = setInterval(function() {
                            if (video.currentTime >= audio.currentTime || video.paused) {
                                audio.play().catch(function(){});
                                clearInterval(watchVideo);
                            }
                        }, 50);
                    }
                } else { audio.currentTime = video.currentTime; }
            } else {
                audio.playbackRate = 1.0;
                if (audio.paused && !video.paused) audio.play().catch(function(){});
            }
        }

        playPauseBtn.onclick = function() {
            if (video.paused) {
                video.play().catch(function(){});
                audio.play().catch(function(){});
                playPauseBtn.innerText = "⏸";
                resetHideTimer(); // Oynatılınca zamanlayıcıyı yeniden kur
            } else {
                video.pause();
                audio.pause();
                playPauseBtn.innerText = "▶";
                playerWrapper.classList.remove('hide-interface'); // Durunca paneli geri getir
                if (hideTimeout) clearTimeout(hideTimeout); // Dururken gizleme
            }
        };

        progressContainer.onclick = function(e) {
            isSeeking = true;
            audio.playbackRate = 1.0;
            var rect = progressContainer.getBoundingClientRect();
            var clickPercentage = (e.clientX - rect.left) / rect.width;
            var newTime = clickPercentage * video.duration;
            
            video.currentTime = newTime;
            audio.currentTime = newTime;
            progressBar.style.width = (clickPercentage * 100) + "%";
            
            setTimeout(function() { isSeeking = false; }, 400);
            resetHideTimer();
        };

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            var mins = Math.floor(seconds / 60);
            var secs = Math.floor(seconds % 60);
            return (mins < 10 ? "0" : "") + mins + ":" + (secs < 10 ? "0" : "") + secs;
        }

        function exitPlayer() {
            if(syncInterval) clearInterval(syncInterval);
            if (hideTimeout) clearTimeout(hideTimeout);
            video.pause();
            audio.pause();
            audio.playbackRate = 1.0;
            playerWrapper.classList.remove('hide-interface');
            playerWrapper.style.display = "none";
            
            var de = document;
            if (de.fullscreenElement || de.webkitFullscreenElement) {
                if(de.exitFullscreen) de.exitFullscreen();
                else if(de.webkitExitFullscreen) de.webkitExitFullscreen();
            }
        }
        document.getElementById('close-btn').onclick = exitPlayer;

        document.addEventListener('fullscreenchange', function() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) exitPlayer();
        });
        document.addEventListener('webkitfullscreenchange', function() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) exitPlayer();
        });
    </script>
</body>
</html>
