<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Senkronize TV Oynatıcı (Gelişmiş Sürüm)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        h2 { text-align: center; color: #00adb5; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #eeeeee; }
        input[type="text"], input[type="url"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #393e46;
            background: #222831;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00adb5;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #007c82; }
        .list-container {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            padding: 15px;
            background: #222831;
            margin-bottom: 10px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        li:hover { background: #393e46; }
        .delete-btn {
            background: #ff2e63;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        /* Altyazıların her ekran türünde düzgün okunabilmesi için stil ayarı */
        video::cue {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 24px;
        }

        /* Tam Ekran Video ve Kontrol Alanı */
        #player-wrapper {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 9999;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        /* Kontrol Çubuğu */
        .controls {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.85);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .control-btn {
            background: none; border: none; color: white;
            font-size: 22px; cursor: pointer; width: auto; padding: 0 10px;
        }
        .progress-container {
            flex-grow: 1; position: relative; cursor: pointer; height: 12px; background: #555; border-radius: 6px;
        }
        .progress-bar { height: 100%; background: #00adb5; width: 0%; border-radius: 6px; }
        .time-display { font-size: 14px; min-width: 100px; text-align: center; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="container">
        <h2>Yayın Kayıt Formu (Gelişmiş)</h2>
        <div class="form-group">
            <label>Yayın Adı:</label>
            <input type="text" id="stream-name" placeholder="Örn: Benim Sinemam">
        </div>
        <div class="form-group">
            <label>Video Linki (URL):</label>
            <input type="url" id="video-link" placeholder="https://example.com/video.mp4">
        </div>
        <div class="form-group">
            <label>Ses Linki (URL):</label>
            <input type="url" id="audio-link" placeholder="https://example.com/ses.mp3">
        </div>
        <div class="form-group">
            <label>Altyazı Linki (URL - .vtt formatı tavsiye edilir / İsteğe Bağlı):</label>
            <input type="url" id="subtitle-link" placeholder="https://example.com/altyazi.vtt">
        </div>
        <div class="form-group">
            <label>Giriş ve Silme Şifresi:</label>
            <input type="password" id="stream-password" placeholder="Bu yayını korumak için şifre belirleyin">
        </div>
        <button id="save-btn">Kaydet</button>
    </div>

    <div class="list-container">
        <h3>Kayıtlı Yayınlar</h3>
        <ul id="stream-list">Yükleniyor veya Bağlantı Kuruluyor...</ul>
    </div>

    <div id="player-wrapper">
        <video id="my-video" preload="auto" playsinline></video>
        <audio id="my-audio" preload="auto"></audio>
        
        <div class="controls">
            <button class="control-btn" id="play-pause-btn">⏸</button>
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="time-display" id="time-display">00:00 / 00:00</div>
            <button class="control-btn" id="close-btn">❌ Kapat</button>
