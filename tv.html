<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Senkronize TV Oynatıcı (Kesin Çözüm)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        h2 { text-align: center; color: #00adb5; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #eeeeee; }
        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #393e46;
            background: #222831;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00adb5;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #007c82; }
        .list-container {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            padding: 15px;
            background: #222831;
            margin-bottom: 10px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        li:hover { background: #393e46; }
        .delete-btn {
            background: #ff2e63;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Tam Ekran Video ve Kontrol Alanı */
        #player-wrapper {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 9999;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        /* Kontrol Çubuğu */
        .controls {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.85);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .control-btn {
            background: none; border: none; color: white;
            font-size: 22px; cursor: pointer; width: auto; padding: 0 10px;
        }
        .progress-container {
            flex-grow: 1; position: relative; cursor: pointer; height: 12px; background: #555; border-radius: 6px;
        }
        .progress-bar { height: 100%; background: #00adb5; width: 0%; border-radius: 6px; }
        .time-display { font-size: 14px; min-width: 100px; text-align: center; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="container">
        <h2>Yayın Kayıt Formu (Düzeltilmiş)</h2>
        <div class="form-group">
            <label>Yayın Adı:</label>
            <input type="text" id="stream-name" placeholder="Örn: Benim Sinemam">
        </div>
        <div class="form-group">
            <label>Video Linki (URL):</label>
            <input type="url" id="video-link" placeholder="https://example.com/video.mp4">
        </div>
        <div class="form-group">
            <label>Ses Linki (URL):</label>
            <input type="url" id="audio-link" placeholder="https://example.com/ses.mp3">
        </div>
        <button id="save-btn">Kaydet</button>
    </div>

    <div class="list-container">
        <h3>Kayıtlı Yayınlar</h3>
        <ul id="stream-list">Yükleniyor veya Bağlantı Kuruluyor...</ul>
    </div>

    <div id="player-wrapper">
        <video id="my-video" preload="auto" playsinline></video>
        <audio id="my-audio" preload="auto"></audio>
        
        <div class="controls">
            <button class="control-btn" id="play-pause-btn">⏸</button>
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="time-display" id="time-display">00:00 / 00:00</div>
            <button class="control-btn" id="close-btn">❌ Kapat</button>
        </div>
    </div>

    <script>
        // Sizin Firebase Yapılandırmanız
        var firebaseConfig = {
            apiKey: "AIzaSyCDFqL6UVgbLSYo69qEICQlMppJlxX6g8E",
            authDomain: "naberdeneme-ffa04.firebaseapp.com",
            databaseURL: "https://naberdeneme-ffa04-default-rtdb.firebaseio.com",
            projectId: "naberdeneme-ffa04",
            storageBucket: "naberdeneme-ffa04.firebasestorage.app",
            messagingSenderId: "682126121110",
            appId: "1:682126121110:web:3129487f2c728fb07b4ab7",
            measurementId: "G-1QZEGMF3ZV"
        };

        // Firebase'i Başlatma (Klasik Güvenli Yöntem)
        firebase.initializeApp(firebaseConfig);
        
        // KRİTİK DÜZELTME: databaseURL'i elle database motoruna besliyoruz, böylece boş dönme hatası çözülüyor.
        var db = firebase.database();
        var streamsRef = db.ref('yayinlar');

        var video = document.getElementById('my-video');
        var audio = document.getElementById('my-audio');
        var playerWrapper = document.getElementById('player-wrapper');
        var progressBar = document.getElementById('progress-bar');
        var progressContainer = document.getElementById('progress-container');
        var timeDisplay = document.getElementById('time-display');
        var playPauseBtn = document.getElementById('play-pause-btn');
        var streamList = document.getElementById('stream-list');

        var isSeeking = false;
        var syncInterval = null;

        // 1. Firebase'e Veri Kaydetme (Düzeltildi)
        document.getElementById('save-btn').onclick = function() {
            var name = document.getElementById('stream-name').value.trim();
            var videoUrl = document.getElementById('video-link').value.trim();
            var audioUrl = document.getElementById('audio-link').value.trim();

            if(!name || !videoUrl || !audioUrl) {
                alert("Lütfen tüm alanları doldurun!");
                return;
            }

            // Firebase veritabanına doğrudan push atıyoruz
            streamsRef.push({
                name: name,
                videoUrl: videoUrl,
                audioUrl: audioUrl
            }, function(error) {
                if (error) {
                    alert("Kayıt Başarısız! Firebase kurallarınızı (Rules) kontrol edin: " + error.message);
                } else {
                    document.getElementById('stream-name').value = '';
                    document.getElementById('video-link').value = '';
                    document.getElementById('audio-link').value = '';
                }
            });
        };

        // 2. Firebase'den Verileri Anlık Okuma ve Ekrana Basma (Düzeltildi)
        streamsRef.on('value', function(snapshot) {
            streamList.innerHTML = '';
            var data = snapshot.val();
            
            if (!data) {
                streamList.innerHTML = '<li>Henüz kayıtlı yayın yok.</li>';
                return;
            }

            Object.keys(data).forEach(function(key) {
                var stream = data[key];
                var li = document.createElement('li');
                
                // Satıra tıklanınca medyaları yükle
                li.onclick = function() {
                    startPlayer(stream.videoUrl, stream.audioUrl);
                };
                
                li.innerHTML = "<span><strong>" + stream.name + "</strong></span><button class='delete-btn' data-id='" + key + "'>Sil</button>";
                streamList.appendChild(li);
            });

            // Silme butonlarının olayları
            var deleteButtons = document.querySelectorAll('.delete-btn');
            for(var i=0; i<deleteButtons.length; i++) {
                deleteButtons[i].onclick = function(e) {
                    e.stopPropagation(); // Satırın tıklanma olayını kes
                    var id = this.getAttribute('data-id');
                    db.ref('yayinlar/' + id).remove();
                };
            }
        }, function(error) {
            streamList.innerHTML = '<li>Veri okuma hatası! Firebase Console\'dan Realtime Database kurallarını true yaptığınızdan emin olun.</li>';
        });

        // 3. Atlama Korumalı Oynatıcı Başlatıcı
        function startPlayer(videoUrl, audioUrl) {
            video.src = videoUrl;
            audio.src = audioUrl;
            playerWrapper.style.display = "block";

            video.load();
            audio.load();

            if (playerWrapper.requestFullscreen) playerWrapper.requestFullscreen();
            else if (playerWrapper.webkitRequestFullscreen) playerWrapper.webkitRequestFullscreen();

            video.play().catch(function(){});
            audio.play().catch(function(){});
            playPauseBtn.innerText = "⏸";

            if(syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(smoothSyncCheck, 250);
        }

        // 4. Atlama Yapmayan Akıllı Ses Filtresi
        function smoothSyncCheck() {
            if (isSeeking || video.paused || video.seeking) return;

            var percentage = (video.currentTime / video.duration) * 100;
            if(!isNaN(percentage)) {
                progressBar.style.width = percentage + "%";
                timeDisplay.innerText = formatTime(video.currentTime) + " / " + formatTime(video.duration);
            }

            var diff = video.currentTime - audio.currentTime;

            // Hafif kaymalarda hızı saptırarak kulak tırmalamadan eşitle
            if (Math.abs(diff) > 0.1 && Math.abs(diff) <= 0.5) {
                if (diff > 0) {
                    audio.playbackRate = 1.05;
                } else {
                    audio.playbackRate = 0.95;
                }
            } 
            // Büyük kaymalarda (Projeksiyon donarsa) atlama yapmadan sesi durdurup videoyu bekleme
            else if (Math.abs(diff) > 0.5) {
                audio.playbackRate = 1.0; 
                if (diff < 0) { 
                    if (!audio.paused) {
                        audio.pause();
                        var watchVideo = setInterval(function() {
                            if (video.currentTime >= audio.currentTime || video.paused) {
                                audio.play().catch(function(){});
                                clearInterval(watchVideo);
                            }
                        }, 50);
                    }
                } else {
                    audio.currentTime = video.currentTime;
                }
            } else {
                audio.playbackRate = 1.0;
                if (audio.paused && !video.paused) audio.play().catch(function(){});
            }
        }

        // Oynat / Duraklat
        playPauseBtn.onclick = function() {
            if (video.paused) {
                video.play().catch(function(){});
                audio.play().catch(function(){});
                playPauseBtn.innerText = "⏸";
            } else {
                video.pause();
                audio.pause();
                playPauseBtn.innerText = "▶";
            }
        };

        // İlerleme Çubuğuna Tıklama (Scrubbing)
        progressContainer.onclick = function(e) {
            isSeeking = true;
            audio.playbackRate = 1.0;
            var rect = progressContainer.getBoundingClientRect();
            var clickPercentage = (e.clientX - rect.left) / rect.width;
            var newTime = clickPercentage * video.duration;
            
            video.currentTime = newTime;
            audio.currentTime = newTime;
            progressBar.style.width = (clickPercentage * 100) + "%";
            
            setTimeout(function() { isSeeking = false; }, 400);
        };

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            var mins = Math.floor(seconds / 60);
            var secs = Math.floor(seconds % 60);
            return (mins < 10 ? "0" : "") + mins + ":" + (secs < 10 ? "0" : "") + secs;
        }

        function exitPlayer() {
            if(syncInterval) clearInterval(syncInterval);
            video.pause();
            audio.pause();
            audio.playbackRate = 1.0;
            playerWrapper.style.display = "none";
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                if(document.exitFullscreen) document.exitFullscreen();
                else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }
        document.getElementById('close-btn').onclick = exitPlayer;

        var fsEvents = ['fullscreenchange', 'webkitfullscreenchange'];
        fsEvents.forEach(function(evt) {
            document.addEventListener(evt, function() {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) exitPlayer();
            });
        });
    </script>
</body>
</html>
