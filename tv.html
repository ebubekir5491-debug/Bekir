<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Senkronize TV Oynatıcı (Eski Cihaz Uyumlu)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        h2 { text-align: center; color: #00adb5; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #eeeeee; }
        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #393e46;
            background: #222831;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00adb5;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #007c82; }
        .list-container {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            padding: 15px;
            background: #222831;
            margin-bottom: 10px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        li:hover { background: #393e46; }
        .delete-btn {
            background: #ff2e63;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Tam Ekran Video ve Kontrol Alanı */
        #player-wrapper {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 9999;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        /* Kontrol Çubuğu */
        .controls {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.85);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 15px;
            opacity: 1; /* Eski cihazlarda kaybolup gelme sorunu olmasın diye sabit görünür yapıldı */
        }
        .control-btn {
            background: none; border: none; color: white;
            font-size: 22px; cursor: pointer; width: auto; padding: 0 10px;
        }
        .progress-container {
            flex-grow: 1; position: relative; cursor: pointer; height: 12px; background: #555; border-radius: 6px;
        }
        .progress-bar { height: 100%; background: #00adb5; width: 0%; border-radius: 6px; }
        .time-display { font-size: 14px; min-width: 100px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Yayın Kayıt Formu (Uyumlu Sürüm)</h2>
        <div class="form-group">
            <label>Yayın Adı:</label>
            <input type="text" id="stream-name" placeholder="Örn: Benim Sinemam">
        </div>
        <div class="form-group">
            <label>Video Linki (URL):</label>
            <input type="url" id="video-link" placeholder="https://example.com/video.mp4">
        </div>
        <div class="form-group">
            <label>Ses Linki (URL):</label>
            <input type="url" id="audio-link" placeholder="https://example.com/ses.mp3">
        </div>
        <button id="save-btn">Kaydet</button>
    </div>

    <div class="list-container">
        <h3>Kayıtlı Yayınlar</h3>
        <ul id="stream-list">Yükleniyor...</ul>
    </div>

    <div id="player-wrapper">
        <video id="my-video" preload="auto" playsinline></video>
        <audio id="my-audio" preload="auto"></audio>
        
        <div class="controls">
            <button class="control-btn" id="play-pause-btn">⏸</button>
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="time-display" id="time-display">00:00 / 00:00</div>
            <button class="control-btn" id="close-btn">❌ Kapat</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCDFqL6UVgbLSYo69qEICQlMppJlxX6g8E",
            authDomain: "naberdeneme-ffa04.firebaseapp.com",
            databaseURL: "https://naberdeneme-ffa04-default-rtdb.firebaseio.com",
            projectId: "naberdeneme-ffa04",
            storageBucket: "naberdeneme-ffa04.firebasestorage.app",
            messagingSenderId: "682126121110",
            appId: "1:682126121110:web:3129487f2c728fb07b4ab7",
            measurementId: "G-1QZEGMF3ZV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const streamsRef = ref(db, 'yayinlar');

        const video = document.getElementById('my-video');
        const audio = document.getElementById('my-audio');
        const playerWrapper = document.getElementById('player-wrapper');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const timeDisplay = document.getElementById('time-display');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const streamList = document.getElementById('stream-list');

        let isSeeking = false;
        let syncInterval = null; // Eski cihazlar için zorunlu zamanlayıcı döngüsü

        // 1. Firebase Veri Ekleme
        document.getElementById('save-btn').onclick = function() {
            const name = document.getElementById('stream-name').value.trim();
            const videoUrl = document.getElementById('video-link').value.trim();
            const audioUrl = document.getElementById('audio-link').value.trim();

            if(!name || !videoUrl || !audioUrl) {
                alert("Lütfen tüm alanları doldurun!");
                return;
            }

            push(streamsRef, {
                name: name,
                videoUrl: videoUrl,
                audioUrl: audioUrl
            }).then(() => {
                document.getElementById('stream-name').value = '';
                document.getElementById('video-link').value = '';
                document.getElementById('audio-link').value = '';
            }).catch(err => alert("Hata: " + err.message));
        };

        // 2. Firebase Listeleme
        onValue(streamsRef, (snapshot) => {
            streamList.innerHTML = '';
            const data = snapshot.val();
            if (!data) {
                streamList.innerHTML = '<li>Henüz kayıtlı yayın yok.</li>';
                return;
            }

            Object.keys(data).forEach(key => {
                const stream = data[key];
                const li = document.createElement('li');
                
                li.onclick = function() {
                    startPlayer(stream.videoUrl, stream.audioUrl);
                };
                
                li.innerHTML = `
                    <span><strong>${stream.name}</strong></span>
                    <button class="delete-btn" data-id="${key}">Sil</button>
                `;
                streamList.appendChild(li);
            });

            // Silme butonları
            const deleteButtons = document.querySelectorAll('.delete-btn');
            for(let i=0; i<deleteButtons.length; i++) {
                deleteButtons[i].onclick = function(e) {
                    e.stopPropagation();
                    const id = this.getAttribute('data-id');
                    remove(ref(db, 'yayinlar/' + id));
                };
            }
        });

        // 3. Projeksiyon ve Eski Cihazlar İçin Güçlendirilmiş Oynatıcı Başlatıcı
        function startPlayer(videoUrl, audioUrl) {
            video.src = videoUrl;
            audio.src = audioUrl;
            playerWrapper.style.display = "block";

            // Eski cihazlarda takılmayı önlemek için direkt yükle emri veriyoruz
            video.load();
            audio.load();

            // Tam ekran kodları (Eski Android TV/Projeksiyon uyumlu varyasyonlar)
            if (playerWrapper.requestFullscreen) {
                playerWrapper.requestFullscreen();
            } else if (playerWrapper.webkitRequestFullscreen) {
                playerWrapper.webkitRequestFullscreen();
            } else if (playerWrapper.mozRequestFullScreen) {
                playerWrapper.mozRequestFullScreen();
            } else if (playerWrapper.msRequestFullscreen) {
                playerWrapper.msRequestFullscreen();
            }

            // Garanti başlatma: Tarayıcı 'canplay' olayını kaçırırsa diye direkt oynatmayı deniyoruz
            video.play().catch(()=>{});
            audio.play().catch(()=>{});
            playPauseBtn.innerText = "⏸";

            // Projeksiyon için kritik adım: Donanımsal gecikmeleri yakalamak adına 
            // her 150 milisaniyede bir (saniyede ~7 kez) arka planda zorunlu senkronizasyon kontrolü başlatıyoruz.
            if(syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(forceSyncCheck, 150);
        }

        // 4. Agresif Senkronizasyon Motoru (Projeksiyon için)
        function forceSyncCheck() {
            if (isSeeking || video.paused) return;

            // İlerleme çubuğu ve süre yazısını güncelle
            const percentage = (video.currentTime / video.duration) * 100;
            if(!isNaN(percentage)) {
                progressBar.style.width = percentage + "%";
                timeDisplay.innerText = formatTime(video.currentTime) + " / " + formatTime(video.duration);
            }

            // Hassasiyeti 0.15 saniyeye indirdik. Projeksiyon cihazı videoyu çözerken 
            // ufacık bir yavaşlama yaşarsa ses anında duraksayıp videonun hizasına çekilir.
            const diff = video.currentTime - audio.currentTime;
            if (Math.abs(diff) > 0.15) {
                audio.currentTime = video.currentTime;
                // Eğer ses tamamen geride kalıp donduysa tekrar oynatmayı tetikle
                if(audio.paused && !video.paused) audio.play().catch(()=>{});
            }
        }

        // Duraklat / Devam Et
        playPauseBtn.onclick = function() {
            if (video.paused) {
                video.play().catch(()=>{});
                audio.play().catch(()=>{});
                playPauseBtn.innerText = "⏸";
            } else {
                video.pause();
                audio.pause();
                playPauseBtn.innerText = "▶";
            }
        };

        // 5. İlerletme Çubuğu Tıklama Algılayıcısı
        progressContainer.onclick = function(e) {
            isSeeking = true;
            const rect = progressContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickPercentage = clickX / rect.width;
            const newTime = clickPercentage * video.duration;
            
            // Önce videoyu ardından sesi eş zamanlı yeni saniyeye atıyoruz
            video.currentTime = newTime;
            audio.currentTime = newTime;
            
            progressBar.style.width = (clickPercentage * 100) + "%";
            
            // Eski cihazlarda atlama sonrası sesin oynatılmaya devam ettiğinden emin oluyoruz
            if(!video.paused) {
                audio.play().catch(()=>{});
            }
            
            // Cihazın hafızasına toparlanması için kısa bir süre tanıyoruz
            setTimeout(() => { isSeeking = false; }, 200);
        };

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return (mins < 10 ? "0" : "") + mins + ":" + (secs < 10 ? "0" : "") + secs;
        }

        function exitPlayer() {
            if(syncInterval) clearInterval(syncInterval);
            video.pause();
            audio.pause();
            playerWrapper.style.display = "none";
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                if(document.exitFullscreen) document.exitFullscreen();
                else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }
        document.getElementById('close-btn').onclick = exitPlayer;

        // Kumandadan veya ESC ile tam ekrandan çıkılırsa temizle
        const fsEvents = ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'];
        fsEvents.forEach(evt => {
            document.addEventListener(evt, () => {
                if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement) {
                    exitPlayer();
                }
            });
        });
    </script>
</body>
</html>
