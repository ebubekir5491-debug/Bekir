<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobil Çizim Uygulaması</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
            background-color: #f0f0f0;
        }
        /* Ana Kapsayıcı */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        /* Sol Araç Çubuğu (Sidebar) */
        .sidebar {
            width: 65px;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            gap: 15px;
            z-index: 10;
            box-shadow: 2px 0 5px rgba(0,0,0,0.2);
        }
        .tool-btn {
            width: 45px;
            height: 45px;
            background-color: #34495e;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: all 0.2s;
        }
        .tool-btn.active {
            background-color: #e74c3c;
            border-color: #fff;
        }
        .tool-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        /* Çizim Alanı */
        .canvas-area {
            flex: 1;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            touch-action: none; /* Mobil kaydırmasını engeller, çizime odaklar */
        }
        /* Çizilen Öğelerin Ortak Özellikleri */
        .shape {
            position: absolute;
            border: 2px solid #333;
            background-color: rgba(52, 152, 219, 0.4);
            cursor: pointer;
            box-sizing: border-box;
        }
        .shape.selected {
            outline: 2px dashed #e74c3c;
            outline-offset: 2px;
        }
        /* Çizgi için özel stil */
        .shape-line {
            position: absolute;
            background-color: #333;
            transform-origin: top left;
            height: 4px;
            border: none;
        }
        /* Düzenleme Menüsü (Modal Popup) */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
            z-index: 100;
            width: 280px;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.4);
            z-index: 99;
        }
        .modal h3 {
            margin-bottom: 15px;
            font-size: 16px;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-size: 13px;
            color: #7f8c8d;
        }
        .form-group input {
            padding: 8px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 14px;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-cancel { background: #eee; color: #333; }
        .btn-save { background: #2ecc71; color: white; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Sol Bar -->
    <div class="sidebar">
        <!-- Kare Butonu -->
        <button class="tool-btn" id="tool-rect" onclick="selectTool('rect')" title="Kare/Dikdörtgen">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <!-- Çizgi Butonu -->
        <button class="tool-btn" id="tool-line" onclick="selectTool('line')" title="Çizgi">
            <svg viewBox="0 0 24 24"><line x1="3" y1="21" x2="21" y2="3" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <!-- Daire Butonu -->
        <button class="tool-btn" id="tool-circle" onclick="selectTool('circle')" title="Daire">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
    </div>

    <!-- Çizim Alanı -->
    <div class="canvas-area" id="canvas"></div>
</div>

<!-- Düzenleme Pop-up Menüsü -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
<div class="modal" id="editModal">
    <h3 id="modalTitle">Öğe Düzenle</h3>
    <div class="form-group" id="widthGroup">
        <label id="widthLabel">Genişlik (mm):</label>
        <input type="number" id="inputWidth" min="1">
    </div>
    <div class="form-group" id="heightGroup">
        <label>Yükseklik / Kalınlık (mm):</label>
        <input type="number" id="inputHeight" min="1">
    </div>
    <div class="form-group">
        <label>Renk Seçimi:</label>
        <input type="color" id="inputColor" value="#3498db">
    </div>
    <div class="modal-buttons">
        <button class="btn btn-cancel" onclick="closeModal()">İptal</button>
        <button class="btn btn-save" onclick="saveProperties()">Tamam</button>
    </div>
</div>

<script>
    let currentTool = null;
    let isDrawing = false;
    let startX, startY;
    let activeElement = null;
    let selectedElementForEdit = null;
    
    // Ekranda 1 mm'nin kaç piksele denk geleceğini simüle ediyoruz (Standart mobil yoğunluğu için yaklaşık değer)
    const MM_TO_PX = 3.78; 

    const canvas = document.getElementById('canvas');
    const editModal = document.getElementById('editModal');
    const modalOverlay = document.getElementById('modalOverlay');

    // Araç Seçimi
    function selectTool(tool) {
        currentTool = tool;
        document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tool-${tool}`).classList.add('active');
    }

    // Dokunma ve Fare Olay Takipleri (Mobil + Masaüstü uyumu için)
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', endDraw);

    canvas.addEventListener('touchstart', (e) => { startDraw(e.touches[0]); });
    canvas.addEventListener('touchmove', (e) => { draw(e.touches[0]); });
    window.addEventListener('touchend', endDraw);

    function startDraw(e) {
        if (!currentTool) return;
        // Eğer menü açıksa veya başka bir nesneye tıklanıyorsa çizim başlatma
        if (e.target !== canvas) return; 

        isDrawing = true;
        const rect = canvas.getBoundingClientRect();
        startX = e.clientX - rect.left;
        startY = e.clientY - rect.top;

        activeElement = document.createElement('div');
        activeElement.classList.add('shape');
        
        if (currentTool === 'rect') {
            activeElement.style.left = `${startX}px`;
            activeElement.style.top = `${startY}px`;
        } else if (currentTool === 'circle') {
            activeElement.style.left = `${startX}px`;
            activeElement.style.top = `${startY}px`;
            activeElement.style.borderRadius = '50%';
        } else if (currentTool === 'line') {
            activeElement.classList.add('shape-line');
            activeElement.style.left = `${startX}px`;
            activeElement.style.top = `${startY}px`;
        }

        canvas.appendChild(activeElement);
    }

    function draw(e) {
        if (!isDrawing || !activeElement) return;

        const rect = canvas.getBoundingClientRect();
        const currentX = e.clientX - rect.left;
        const currentY = e.clientY - rect.top;

        const width = currentX - startX;
        const height = currentY - startY;

        if (currentTool === 'rect' || currentTool === 'circle') {
            // Ters yöne doğru sürükleme kontrolü
            activeElement.style.width = `${Math.abs(width)}px`;
            activeElement.style.height = `${Math.abs(height)}px`;
            activeElement.style.left = `${width < 0 ? currentX : startX}px`;
            activeElement.style.top = `${height < 0 ? currentY : startY}px`;
        } else if (currentTool === 'line') {
            // Çizgi için trigonometrik uzunluk ve açı hesabı
            const length = Math.sqrt(width * width + height * height);
            const angle = Math.atan2(height, width) * 180 / Math.PI;
            activeElement.style.width = `${length}px`;
            activeElement.style.transform = `rotate(${angle}deg)`;
        }
    }

    function endDraw() {
        if (!isDrawing) return;
        isDrawing = false;

        // Çok küçük tıklamalarla oluşan hayalet nesneleri siler
        if (activeElement) {
            const w = parseFloat(activeElement.style.width);
            const h = parseFloat(activeElement.style.height);
            if (currentTool !== 'line' && (isNaN(w) || w < 5 || isNaN(h) || h < 5)) {
                activeElement.remove();
            } else {
                // Çizilen nesneye tıklama özelliği ekle
                const newShape = activeElement;
                newShape.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openEditModal(newShape);
                });
                
                // Tipini dataset olarak sakla
                newShape.dataset.type = currentTool;
            }
        }
        activeElement = null;
    }

    // Düzenleme Penceresini Aç
    function openEditModal(element) {
        selectedElementForEdit = element;
        
        // Seçim efektini göster
        document.querySelectorAll('.shape').forEach(s => s.classList.remove('selected'));
        element.classList.add('selected');

        const type = element.dataset.type;
        const modalTitle = document.getElementById('modalTitle');
        const widthGroup = document.getElementById('widthGroup');
        const widthLabel = document.getElementById('widthLabel');

        // Form görünümünü nesne tipine göre ayarla
        if (type === 'rect') {
            modalTitle.innerText = "Kare / Dikdörtgen Düzenle";
            widthGroup.style.display = "flex";
            widthLabel.innerText = "Genişlik (mm):";
            document.getElementById('inputWidth').value = Math.round(parseFloat(element.style.width) / MM_TO_PX);
            document.getElementById('inputHeight').value = Math.round(parseFloat(element.style.height) / MM_TO_PX);
            document.getElementById('inputColor').value = rgbToHex(element.style.backgroundColor) || "#3498db";
        } else if (type === 'circle') {
            modalTitle.innerText = "Daire Düzenle";
            widthGroup.style.display = "flex";
            widthLabel.innerText = "Çap (mm):";
            document.getElementById('inputWidth').value = Math.round(parseFloat(element.style.width) / MM_TO_PX);
            document.getElementById('inputHeight').value = Math.round(parseFloat(element.style.height) / MM_TO_PX);
            document.getElementById('inputColor').value = rgbToHex(element.style.backgroundColor) || "#3498db";
        } else if (type === 'line') {
            modalTitle.innerText = "Çizgi Düzenle";
            widthGroup.style.display = "flex";
            widthLabel.innerText = "Uzunluk (mm):";
            document.getElementById('inputWidth').value = Math.round(parseFloat(element.style.width) / MM_TO_PX);
            document.getElementById('inputHeight').value = Math.round(parseFloat(element.style.height) || 4); // Çizgi kalınlığı
            document.getElementById('inputColor').value = rgbToHex(element.style.backgroundColor) || "#333333";
        }

        editModal.style.display = 'block';
        modalOverlay.style.display = 'block';
    }

    // Değişiklikleri Kaydet (Tamam Butonu)
    function saveProperties() {
        if (!selectedElementForEdit) return;

        const type = selectedElementForEdit.dataset.type;
        const mmWidth = parseFloat(document.getElementById('inputWidth').value);
        const mmHeight = parseFloat(document.getElementById('inputHeight').value);
        const selectedColor = document.getElementById('inputColor').value;

        const pxWidth = mmWidth * MM_TO_PX;
        const pxHeight = mmHeight * MM_TO_PX;

        if (type === 'rect' || type === 'circle') {
            selectedElementForEdit.style.width = `${pxWidth}px`;
            selectedElementForEdit.style.height = `${pxHeight}px`;
            selectedElementForEdit.style.backgroundColor = hexToRgbA(selectedColor, 0.5); // Şeffaflık korundu
            selectedElementForEdit.style.borderColor = selectedColor;
        } else if (type === 'line') {
            selectedElementForEdit.style.width = `${pxWidth}px`;
            selectedElementForEdit.style.height = `${pxHeight}px`; // Kalınlık
            selectedElementForEdit.style.backgroundColor = selectedColor;
        }

        closeModal();
    }

    function closeModal() {
        editModal.style.display = 'none';
        modalOverlay.style.display = 'none';
        if (selectedElementForEdit) {
            selectedElementForEdit.classList.remove('selected');
            selectedElementForEdit = null;
        }
    }

    // Renk dönüşüm yardımcı fonksiyonları
    function rgbToHex(rgb) {
        if (!rgb) return '';
        if (rgb.startsWith('#')) return rgb;
        const match = rgb.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/);
        if (!match) return '';
        return "#" + ("0" + parseInt(match[1],10).toString(16)).slice(-2) +
                     ("0" + parseInt(match[2],10).toString(16)).slice(-2) +
                     ("0" + parseInt(match[3],10).toString(16)).slice(-2);
    }

    function hexToRgbA(hex, alpha = 1){
        let c;
        if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)){
            c= hex.substring(1).split('');
            if(c.length== 3){
                c= [c[0], c[0], c[1], c[1], c[2], c[2]];
            }
            c= '0x'+c.join('');
            return 'rgba('+[(c>>16)&255, (c>>8)&255, c&255].join(',')+','+alpha+')';
        }
        return hex;
    }
</script>

</body>
</html>
