<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Panel & Montaj Simülasyonu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Alt Sağ Arka Plan Renk Butonu ve Paneli */
        .bg-control-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
        }

        .main-btn {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .main-btn:hover {
            background: #34495e;
            transform: translateY(-2px);
        }

        .popup-panel {
            display: none;
            position: absolute;
            bottom: 60px;
            right: 0;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
            width: 200px;
        }

        /* Alt Sol Menü (Parça Ekleme ve Montaj) */
        .left-menu {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 20;
            width: 300px;
        }

        .modal h3 { margin-top: 0; color: #2c3e50; }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-success { background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        .btn-danger { background: #c0392b; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }

        /* Bilgilendirme Bannerı */
        #info-banner {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 62, 80, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.4);
            z-index: 15;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="info-banner">Aşama Bilgisi</div>
    <div class="overlay" id="overlay"></div>

    <div class="bg-control-container">
        <div class="popup-panel" id="bg-panel">
            <h4 style="margin:0 0 10px 0;">Arka Plan Rengi</h4>
            <input type="color" id="bg-color-picker" value="#ffffff" style="width:100%; height:40px; cursor:pointer;">
        </div>
        <button class="main-btn" onclick="toggleElement('bg-panel')">🎨 Arka Plan</button>
    </div>

    <div class="left-menu">
        <button class="main-btn" onclick="openModelModal()">📦 Parça Ekle</button>
        <button class="main-btn" id="assembly-btn" style="background:#8e44ad;" onclick="startAssemblyMode()">🔧 Montaj Yap</button>
    </div>

    <div class="modal" id="model-modal">
        <h3>Yeni Parça Ölçüleri (mm)</h3>
        <div class="form-group">
            <label>Genişlik (X):</label>
            <input type="number" id="dim-x" value="200" min="10">
        </div>
        <div class="form-group">
            <label>Yükseklik (Y):</label>
            <input type="number" id="dim-y" value="150" min="10">
        </div>
        <div class="form-group">
            <label>Kalınlık (Z):</label>
            <input type="number" id="dim-z" value="20" min="10">
        </div>
        <div class="form-group">
            <label>Parça Rengi:</label>
            <input type="color" id="part-color" value="#3498db">
        </div>
        <div class="btn-group">
            <button class="btn-danger" onclick="closeModelModal()">İptal</button>
            <button class="btn-success" onclick="createNewPart()">Ekle</button>
        </div>
    </div>

    <script>
        // --- Global Değişkenler ---
        let scene, camera, renderer, controls;
        let objects = []; // Sahnedeki 3D kutular
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        
        // Sürükleme (Drag) Değişkenleri
        let isDragging = false;
        let selectedObject = null;
        let dragPlane = new THREE.Plane();
        let planeNormal = new THREE.Vector3(0, 1, 0); // XZ düzleminde sürükleme için
        let dragIntersection = new THREE.Vector3();

        // Montaj Değişkenleri
        let assemblyMode = false;
        let selectedFaces = []; // { object, faceIndex, normal, point }

        // --- Sahne Kurulumu ---
        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.set(500, 500, 800);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Işıklandırma
            const ambientLight = new THREE.AmbientLight(0x666666);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(500, 1000, 700);
            scene.add(dirLight);

            // Izgara Yardımı (Referans için)
            const gridHelper = new THREE.GridHelper(2000, 50, 0xcccccc, 0xeeeeee);
            gridHelper.position.y = -0.5;
            scene.add(gridHelper);

            // Kamera Kontrolleri (Sağ tık döndürme, Sol tık sürükleme/seçme, İki parmak zoom)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.mouseButtons = {
                LEFT: THREE.MOUSE.NONE, // Sol tıkı sürükleme için kendimiz yöneteceğiz
                MIDDLE: THREE.MOUSE.DOLLY,
                RIGHT: THREE.MOUSE.ROTATE // Sağ tık ile döndürme
            };
            // Mobil için iki parmakla zoom varsayılan olarak aktiftir.

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('mousedown', onMouseDown);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('mouseup', onMouseUp);

            // Touch (Mobil) Desteği
            renderer.domElement.addEventListener('touchstart', onTouchStart, {passive: false});
            renderer.domElement.addEventListener('touchmove', onTouchMove, {passive: false});
            renderer.domElement.addEventListener('touchend', onTouchEnd);

            animate();
        }

        // --- Arayüz Fonksiyonları ---
        function toggleElement(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        document.getElementById('bg-color-picker').addEventListener('input', (e) => {
            scene.background.set(e.target.value);
            document.body.style.backgroundColor = e.target.value;
        });

        function openModelModal() {
            document.getElementById('model-modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function closeModelModal() {
            document.getElementById('model-modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        // --- Yeni 3D Model Ekleme (mm) ---
        function createNewPart() {
            const x = parseFloat(document.getElementById('dim-x').value);
            const y = parseFloat(document.getElementById('dim-y').value);
            const z = parseFloat(document.getElementById('dim-z').value);
            const color = document.getElementById('part-color').value;

            // mm ölçeğinde BoxGeometry oluşturma
            const geometry = new THREE.BoxGeometry(x, y, z);
            
            // Yüzeylerin seçilebilmesi için MeshStandardMaterial kullanıyoruz
            const material = new THREE.MeshStandardMaterial({
                color: new THREE.Color(color),
                roughness: 0.4,
                metalness: 0.1,
                vertexColors: false
            });

            const mesh = new THREE.Mesh(geometry, material);
            
            // Ekranın ortasına, zemin üzerine yerleştir
            mesh.position.set((Math.random() - 0.5) * 100, y / 2, (Math.random() - 0.5) * 100);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            scene.add(mesh);
            objects.push(mesh);

            closeModelModal();
        }

        // --- Sürükleme, Döndürme ve Seçim Mantığı ---
        function setMouseCoords(e) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        }

        function onMouseDown(e) {
            setMouseCoords(e);
            raycaster.setFromCamera(mouse, camera);

            if (assemblyMode) {
                // Montaj Yüzey Seçim Modu
                const intersects = raycaster.intersectObjects(objects);
                if (intersects.length > 0) {
                    const hit = intersects[0];
                    handleFaceSelection(hit);
                }
            } else if (e.button === 0) { // Sol Tık - Sürükleme Başlangıcı
                const intersects = raycaster.intersectObjects(objects);
                if (intersects.length > 0) {
                    controls.enabled = false; // Kamera dönmesin
                    selectedObject = intersects[0].object;
                    isDragging = true;

                    // Objeyi zemine paralel (XZ düzleminde) sürüklemek için plane ayarla
                    dragPlane.setFromNormalAndCoplanarPoint(planeNormal, selectedObject.position);
                }
            }
        }

        function onMouseMove(e) {
            if (!isDragging || !selectedObject) return;
            setMouseCoords(e);
            raycaster.setFromCamera(mouse, camera);

            if (raycaster.ray.intersectPlane(dragPlane, dragIntersection)) {
                // Objenin X ve Z konumunu güncelle (Y sabit kalır)
                selectedObject.position.x = dragIntersection.x;
                selectedObject.position.z = dragIntersection.z;
            }
        }

        function onMouseUp(e) {
            isDragging = false;
            selectedObject = null;
            if (!assemblyMode) controls.enabled = true; // Kamerayı serbest bırak
        }

        // --- Mobil (Touch) Entegrasyonu ---
        function onTouchStart(e) {
            if (e.touches.length === 1) { // Tek parmak sürükleme
                onMouseDown(e.touches[0]);
            }
        }
        function onTouchMove(e) {
            if (e.touches.length === 1) {
                onMouseMove(e.touches[0]);
            }
        }
        function onTouchEnd(e) {
            onMouseUp();
        }

        // --- Montaj Mantığı (Assembly) ---
        function startAssemblyMode() {
            assemblyMode = true;
            selectedFaces = [];
            controls.enabled = false; // Montaj esnasında parçalar seçilirken kamera kilitlensin
            showBanner("1. Parçanın montaj yüzeyini seçin.");
            document.getElementById('assembly-btn').style.background = '#e67e22';
        }

        function handleFaceSelection(hit) {
            // Aynı objeyi üst üste seçmeyi engelle
            if (selectedFaces.length === 1 && selectedFaces[0].object === hit.object) {
                alert("Lütfen farklı bir parçanın yüzeyini seçin!");
                return;
            }

            // Seçilen yüzeyin dünya koordinatlarındaki normalini (yönünü) hesapla
            const normalMatrix = new THREE.Matrix3().getNormalMatrix(hit.object.matrixWorld);
            const worldNormal = hit.face.normal.clone().applyMatrix3(normalMatrix).normalize();

            selectedFaces.push({
                object: hit.object,
                point: hit.point,
                normal: worldNormal
            });

            // Yüzey seçim efekti (Geçici renk değişimi)
            const origColor = hit.object.material.color.getHex();
            hit.object.material.color.setHex(0xff0000);
            setTimeout(() => hit.object.material.color.setHex(origColor), 600);

            if (selectedFaces.length === 1) {
                showBanner("2. Parçanın montaj yüzeyini seçin.");
            } else if (selectedFaces.length === 2) {
                executeAssembly();
            }
        }

        function executeAssembly() {
            const distStr = prompt("Montaj mesafesini girin (Yüz yüze sıfır için 0, paralel uzaklık için mm cinsinden değer):", "0");
            const distance = parseFloat(distStr) || 0;

            const p1 = selectedFaces[0];
            const p2 = selectedFaces[1];

            // 1. İki objenin birbirine bakacak şekilde yönlendirilmesi (Rotasyon/Açı Hizalama)
            // p2 objesini, p2'nin seçilen yüzey normali p1'in normalinin tam tersi (-p1.normal) olacak şekilde döndürüyoruz.
            const targetNormal = p1.normal.clone().negate();
            const quaternion = new THREE.Quaternion().setFromUnitVectors(p2.normal, targetNormal);
            p2.object.quaternion.premultiply(quaternion);
            p2.object.updateMatrixWorld();

            // Güncellenmiş normali tekrar hesapla
            const normalMatrix = new THREE.Matrix3().getNormalMatrix(p2.object.matrixWorld);
            const newP2Normal = p2.normal.clone().applyMatrix3(normalMatrix).normalize();

            // 2. Pozisyon Hizalama (Yüzeyleri Öpüştürme veya Mesafe Koyma)
            // p2'yi p1'in üzerine taşımak için gereken vektör
            const targetPosition = p1.point.clone().add(p1.normal.clone().multiplyScalar(distance));
            
            // p2'nin seçilen yüzey noktası ile merkez objesi arasındaki farkı bulup p2'yi kaydırıyoruz
            const p2CenterToFace = p2.point.clone().sub(p2.object.position);
            p2CenterToFace.applyQuaternion(quaternion); // Döndürme sonrası kayma vektörü güncellemesi

            p2.object.position.copy(targetPosition.sub(p2CenterToFace));

            // Sistem Sıfırlama
            endAssemblyMode();
        }

        function endAssemblyMode() {
            assemblyMode = false;
            selectedFaces = [];
            controls.enabled = true;
            document.getElementById('assembly-btn').style.background = '#8e44ad';
            hideBanner();
        }

        function showBanner(text) {
            const banner = document.getElementById('info-banner');
            banner.innerText = text;
            banner.style.display = 'block';
        }

        function hideBanner() {
            document.getElementById('info-banner').style.display = 'none';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Uygulamayı Başlat
        init();
    </script>
</body>
</html>
