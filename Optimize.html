<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Net Kesim Talimatları - Ada Sineklik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @page { size: A4 portrait; margin: 10mm; }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            #print-area { width: 100%; margin: 0; box-shadow: none; }
        }
        .instruction-row:nth-child(even) { background-color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-200 p-4 font-sans">

    <div class="max-w-4xl mx-auto mb-6 no-print bg-white p-4 rounded-xl shadow-lg flex gap-4 items-end border-b-4 border-indigo-600">
        <div class="flex-1">
            <label class="block text-xs font-black text-slate-500 mb-1">FORM NUMARASI</label>
            <input type="text" id="search-no" class="w-full p-3 bg-slate-100 border-2 border-slate-300 rounded-lg font-bold text-xl focus:border-indigo-500 outline-none" placeholder="Örn: 00005">
        </div>
        <button onclick="fetchAndOptimize()" class="bg-indigo-600 text-white px-8 py-4 rounded-lg font-black hover:bg-indigo-700 transition-all uppercase text-sm">Kesim Planını Çıkar</button>
        <button onclick="window.print()" class="bg-slate-800 text-white px-8 py-4 rounded-lg font-black hover:bg-slate-900 transition-all uppercase text-sm">Yazdır / PDF</button>
    </div>

    <div id="print-area" class="max-w-4xl mx-auto bg-white p-8 shadow-2xl rounded-sm min-h-[297mm]">
        
        <div class="border-b-4 border-slate-800 pb-4 mb-6 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-black text-slate-800 uppercase">Net Kesim Tablosu</h1>
                <p id="cust-info" class="text-sm font-bold text-slate-600 mt-1 uppercase">Müşteri Bekleniyor...</p>
            </div>
            <div class="text-right">
                <p class="text-[10px] font-bold text-slate-400 uppercase">Sipariş No</p>
                <p id="order-no-display" class="text-3xl font-mono font-black text-red-600 leading-none">-----</p>
            </div>
        </div>

        <div class="bg-yellow-50 border border-yellow-400 text-yellow-800 text-xs font-bold p-3 rounded mb-6 flex justify-between">
            <span>⚠️ SADECE KASA VE KANAT PROFİLLERİ LİSTELENMİŞTİR.</span>
            <span>Kural: <span class="text-red-600">55 cm'den kısa parçalar HURDA kabul edilir.</span></span>
        </div>

        <div id="results-area" class="space-y-8">
            <div class="py-10 text-center text-slate-400 italic font-medium">Lütfen sipariş numarasını girerek planı oluşturun...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAVUGH6f9XgwY2Izi2PG0mUW_2hoUW_Ywc",
            authDomain: "adasineklik54-4c11c.firebaseapp.com",
            databaseURL: "https://adasineklik54-4c11c-default-rtdb.firebaseio.com",
            projectId: "adasineklik54-4c11c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Parametreler
        const STOCK_LENGTH_MM = 6000; 
        const KERF_MM = 3; 
        const TRIM_START_MM = 2; 
        const TRIM_END_MM = 2; 
        const USABLE_STOCK_MM = STOCK_LENGTH_MM - TRIM_START_MM - TRIM_END_MM;
        const SCRAP_LIMIT_CM = 55; // 55 cm altı hurda

        window.fetchAndOptimize = async function() {
            const orderNo = document.getElementById('search-no').value.padStart(5, '0');
            if(!orderNo) return alert("Lütfen form numarası girin!");

            document.getElementById('results-area').innerHTML = `<div class="py-10 text-center text-indigo-600 font-black animate-pulse">Veriler Çekiliyor...</div>`;

            try {
                const [siparisSnap, kesimAyariSnap] = await Promise.all([
                    get(ref(db, `siparisler/${orderNo}`)),
                    get(ref(db, 'ayarlar/kesim_ayarlari'))
                ]);

                if(!siparisSnap.exists()) {
                    document.getElementById('results-area').innerHTML = `<div class="py-10 text-center text-red-500 font-bold">Sipariş bulunamadı!</div>`;
                    return;
                }

                const data = siparisSnap.val();
                const kesimVerisi = kesimAyariSnap.exists() ? 
                    (Array.isArray(kesimAyariSnap.val()) ? kesimAyariSnap.val() : Object.values(kesimAyariSnap.val())) : [];

                document.getElementById('order-no-display').innerText = data.form_bilgileri.form_no;
                document.getElementById('cust-info').innerText = `${data.form_bilgileri.musteri_ad} | ${data.form_bilgileri.musteri_tel}`;

                let cutList = extractCutsFromOrder(data.siparis_icerigi, kesimVerisi);
                runOptimization(cutList);

            } catch (err) {
                alert("Hata: " + err.message);
                console.error(err);
            }
        }

        function extractCutsFromOrder(siparisIcerigi, kesimGroups) {
            let extractedList = [];

            siparisIcerigi.forEach((satir) => {
                let siparisAdet = parseFloat(satir['Adet'] || satir['adet'] || satir['Miktar'] || 1) || 1;
                let renk = satir['Renk'] || satir['renk'] || satir['RENK'] || "Beyaz";

                kesimGroups.forEach(group => {
                    let nihaiSonuc = "-";
                    
                    if (group.rules && Array.isArray(group.rules)) {
                        for (let rule of group.rules) {
                            const hamDeger = satir[rule.condCol];
                            const siparisDegeri = String(hamDeger || "").toLowerCase().trim();
                            const arananDeger = String(rule.condVal || "").toLowerCase().trim();
                            const op = rule.condOp || "=="; 

                            let kosulSaglandi = false;
                            const sNum = parseFloat(siparisDegeri);
                            const aNum = parseFloat(arananDeger);

                            if (!rule.condVal) kosulSaglandi = true; 
                            else if (!isNaN(sNum) && !isNaN(aNum)) {
                                switch(op) {
                                    case "==": kosulSaglandi = (sNum === aNum); break;
                                    case ">":  kosulSaglandi = (sNum > aNum); break;
                                    case "<":  kosulSaglandi = (sNum < aNum); break;
                                    case ">=": kosulSaglandi = (sNum >= aNum); break;
                                    case "<=": kosulSaglandi = (sNum <= aNum); break;
                                }
                            } else kosulSaglandi = (siparisDegeri === arananDeger);

                            if (kosulSaglandi && rule.chain && Array.isArray(rule.chain)) {
                                let hesap = 0;
                                rule.chain.forEach((step, stepIdx) => {
                                    let currentVal = step.type === 'col' ? (parseFloat(satir[step.val]) || 0) : (parseFloat(step.val) || 0);
                                    if (stepIdx === 0) hesap = currentVal;
                                    else {
                                        switch(step.op) {
                                            case '+': hesap += currentVal; break;
                                            case '-': hesap -= currentVal; break;
                                            case '*': hesap *= currentVal; break;
                                            case '/': hesap = currentVal !== 0 ? hesap / currentVal : 0; break;
                                        }
                                    }
                                });
                                if (hesap !== 0) nihaiSonuc = parseFloat(hesap.toFixed(1));
                                break; 
                            }
                        }
                    }

                    if(nihaiSonuc !== "-" && typeof nihaiSonuc === 'number' && nihaiSonuc > 0) {
                        let profType = "";
                        // SADECE KASA VE KANAT FİLTRESİ
                        if(group.title.toUpperCase().includes("KASA")) profType = "Kasa";
                        else if(group.title.toUpperCase().includes("KANAT")) profType = "Kanat";

                        if(profType !== "") {
                            let carpan = (group.title.toUpperCase().includes("EN") || group.title.toUpperCase().includes("BOY")) ? 2 : 1;
                            let kesilecekAdet = siparisAdet * carpan;

                            extractedList.push({
                                color: renk,
                                type: profType,
                                lengthCm: nihaiSonuc,
                                qty: kesilecekAdet
                            });
                        }
                    }
                });
            });

            return extractedList;
        }

        function runOptimization(cutList) {
            const resultsArea = document.getElementById('results-area');
            if (cutList.length === 0) {
                resultsArea.innerHTML = `<div class="py-10 text-center text-red-500 font-bold">Bu siparişte Kasa veya Kanat profili bulunamadı.</div>`;
                return;
            }

            let allPieces = [];
            cutList.forEach(item => {
                for (let i = 0; i < item.qty; i++) {
                    allPieces.push({
                        color: item.color,
                        type: item.type,
                        lengthMm: item.lengthCm * 10,
                        originalCm: item.lengthCm
                    });
                }
            });

            // Renk ve Türe Göre Grupla
            const groups = {};
            allPieces.forEach(p => {
                const key = `${p.color} ${p.type}`;
                if (!groups[key]) groups[key] = [];
                groups[key].push(p);
            });

            resultsArea.innerHTML = '';

            for (const [groupName, pieces] of Object.entries(groups)) {
                // Büyükten Küçüğe Sırala (BFD)
                pieces.sort((a, b) => b.lengthMm - a.lengthMm);

                let stocks = [];

                pieces.forEach(piece => {
                    const requiredSpace = piece.lengthMm + KERF_MM;
                    let bestStock = null;
                    let minLeftover = Infinity;

                    for (let stock of stocks) {
                        const freeSpace = USABLE_STOCK_MM - stock.usedMm;
                        if (freeSpace >= requiredSpace && freeSpace < minLeftover) {
                            bestStock = stock;
                            minLeftover = freeSpace;
                        }
                    }

                    if (bestStock) {
                        bestStock.pieces.push(piece);
                        bestStock.usedMm += requiredSpace;
                    } else {
                        stocks.push({
                            id: stocks.length + 1,
                            pieces: [piece],
                            usedMm: requiredSpace
                        });
                    }
                });

                renderTextInstructions(groupName, stocks, resultsArea);
            }
        }

        function renderTextInstructions(groupName, stocks, container) {
            let html = `
            <div class="mb-8 page-break-inside-avoid">
                <h2 class="text-xl font-black text-slate-800 border-b-2 border-slate-400 pb-2 mb-4">
                    ${groupName} Profili <span class="text-sm font-bold text-indigo-600 bg-indigo-100 px-2 py-1 rounded ml-2">Toplam: ${stocks.length} Boy (6 Metre)</span>
                </h2>
                <div class="border border-slate-300 rounded-lg overflow-hidden shadow-sm">
            `;

            stocks.forEach((stock, index) => {
                // Aynı ölçüleri grupla (Örn: 160, 160, 160 -> 3 Adet 160)
                let counts = {};
                stock.pieces.forEach(p => {
                    counts[p.originalCm] = (counts[p.originalCm] || 0) + 1;
                });

                let stepsHtml = "";
                for (let [cm, qty] of Object.entries(counts)) {
                    stepsHtml += `<span class="inline-block bg-slate-200 text-slate-800 font-bold px-3 py-1 rounded border border-slate-300 mr-2 mb-2 shadow-sm">${qty} Adet <span class="text-indigo-700 text-lg">${cm} cm</span> kes</span>`;
                }

                // Kalan hesaplaması (En sondaki testere payını geri ekliyoruz çünkü son kesimden sonra testere yemiyor)
                let leftoverMm = USABLE_STOCK_MM - stock.usedMm + KERF_MM; 
                let leftoverCm = parseFloat((leftoverMm / 10).toFixed(1));

                let leftoverText = "";
                if (leftoverCm < SCRAP_LIMIT_CM) {
                    leftoverText = `<span class="text-red-600 font-black">HURDAYA AT</span> <span class="text-xs text-red-500 font-bold">(${leftoverCm} cm)</span>`;
                } else {
                    leftoverText = `<span class="text-emerald-600 font-black">STOĞA BIRAK</span> <span class="text-xs text-emerald-600 font-bold">(Kalan sağlam: ${leftoverCm} cm)</span>`;
                }

                html += `
                <div class="instruction-row p-4 border-b border-slate-200 last:border-0 flex flex-col md:flex-row gap-4 items-start md:items-center">
                    <div class="w-full md:w-32">
                        <div class="bg-slate-800 text-white text-center font-black py-2 rounded text-sm uppercase">Profil ${index + 1}</div>
                        <div class="text-[10px] text-center text-slate-500 font-bold mt-1">Yeni 6 Metre</div>
                    </div>
                    
                    <div class="flex-1 border-l-2 border-indigo-200 pl-4">
                        <div class="text-xs font-bold text-slate-500 uppercase mb-2">Uygulanacak Kesimler (Sırasıyla):</div>
                        <div>${stepsHtml}</div>
                    </div>

                    <div class="w-full md:w-48 bg-white border-2 border-dashed ${leftoverCm < SCRAP_LIMIT_CM ? 'border-red-300 bg-red-50' : 'border-emerald-300 bg-emerald-50'} p-3 rounded text-center">
                        <div class="text-[10px] text-slate-500 font-bold uppercase mb-1">İşlem Sonu Artan:</div>
                        ${leftoverText}
                    </div>
                </div>
                `;
            });

            html += `</div></div>`;
            container.innerHTML += html;
        }
    </script>
</body>
</html>
